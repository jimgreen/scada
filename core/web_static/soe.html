<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IEC104 · SOE 事件</title>
<link rel="stylesheet" href="/static/soe.css"></head><body data-soe="1"><header></header><main>
<section class="panel soe-panel soe-events">
<div class="soe-heading"><h2 title="按事件序号保留每次变位与品质变化，源时标按 UTC 显示，页面最多保留最近 500 条">SOE 事件顺序记录</h2><span id="component">IEC104 遥信事件</span></div>
<div class="soe-controls">
<label>RTU <select id="rtu"><option value="">全部 RTU</option></select></label>
<button id="latest" class="primary">查看最新</button><button id="history">从最早读取</button><button id="next">继续读取</button>
<label><input id="auto" type="checkbox" checked> 自动刷新</label>
</div>
<p id="status" role="status" aria-live="polite">正在读取…</p>
<div class="soe-scroll" tabindex="0" aria-label="SOE 事件列表"><table><thead><tr><th>序号</th><th>RTU / 通道</th><th>点号</th><th>CA / IOA</th><th>类型 / COT</th><th>原始状态</th><th>品质</th><th>源时间 UTC</th><th>接收/记录时间 UTC</th><th>时间标志</th><th>CP56 原始字节</th></tr></thead><tbody id="events"></tbody></table></div></section>
<section class="panel soe-panel soe-progress"><div class="soe-heading"><h2 title="表示原连接已返回 IEC104 APCI 确认">已确认的转发进度</h2></div>
<div class="soe-scroll" tabindex="0" aria-label="转发进度列表"><table><thead><tr><th>消费者</th><th>已确认事件序号</th><th>确认保存时间 UTC</th></tr></thead><tbody id="cursors"></tbody></table></div></section>
</main><script src="/static/soe.js"></script></body></html>
