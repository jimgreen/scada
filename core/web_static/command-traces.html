<!doctype html><html lang="zh-CN" data-theme="minimalist-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指令追踪 · SCADA</title><link rel="stylesheet" href="/static/diagnostics.css"><link rel="stylesheet" href="/static/ui-theme.css"><script defer src="/static/ui-i18n.js"></script><script defer src="/static/command-traces.js"></script></head>
<body><header><strong>SCADA · 指令追踪</strong><a href="/">返回工作台</a></header><main><section class="diag-panel">
<div class="diag-toolbar"><h2>遥控 / 遥调指令追踪</h2><label>阶段 <select id="stage"><option value="">全部</option><option value="queued">已入库待派发</option><option value="dispatching">已开始派发</option><option value="select_sent">选择请求已提交</option><option value="select_confirmed">选择已确认</option><option value="execute_sent">执行请求已提交</option><option value="protocol_confirmed">规约已确认</option><option value="driver_completed">驱动调用完成</option><option value="received">S 数据库已接收</option><option value="failed">失败或未确认</option></select></label><button id="refresh">刷新最新</button></div>
<div class="diag-toolbar"><label>RTU <select id="rtu"><option value="">全部 RTU</option></select></label><label>类型 <select id="kind"><option value="">全部</option><option value="yk">遥控</option><option value="yt">遥调</option></select></label><label>名称 <input id="keyword" maxlength="120" placeholder="RTU 名称或点名"></label><label>起始 <input id="from" type="datetime-local"></label><label>结束 <input id="to" type="datetime-local"></label><button id="filter">查询</button><button id="clear">清空条件</button><button id="configure" disabled>配置回采关联</button></div>
<p id="message" role="status"></p>
<div class="diag-scroll"><table><thead><tr><th>命令编号</th><th>RTU / 点名</th><th>值</th><th>阶段 / 确认范围</th><th>入库 / 接收</th><th>完成</th><th>回采 / 核对 / 结案</th><th>查看与配置</th></tr></thead><tbody id="commands"></tbody></table></div>
<button id="older">更早记录</button>
</section></main>
<dialog id="rule-dialog"><form id="rule-form"><h2>命令回采关联</h2><div class="command-form">
<label>命令 RTU <select id="rule-rtu" required></select></label><label>命令类型 <select id="rule-kind"><option value="yk">遥控 → 遥信</option><option value="yt">遥调 → 遥测</option></select></label>
<label>查找命令点 <input id="rule-query" maxlength="120" placeholder="按名称或点号过滤"></label><button type="button" id="rule-find">查找</button><label>命令点 <select id="rule-point" required></select></label>
<label>回采 RTU <select id="feedback-rtu" required></select></label><label>查找回采点 <input id="feedback-query" maxlength="120" placeholder="按名称或点号过滤"></label><button type="button" id="feedback-find">查找</button><label>回采点 <select id="feedback-point" required></select></label>
<label title="预期值 = 命令值 × 比例 + 偏移">比例 <input id="gain" type="number" step="any" value="1" required></label><label title="预期值 = 命令值 × 比例 + 偏移">偏移 <input id="offset" type="number" step="any" value="0" required></label><label>允许绝对偏差 <input id="tolerance" type="number" min="0" step="any" value="0" required></label><label>回采超时（毫秒）<input id="timeout-ms" type="number" min="100" max="3600000" step="1" value="5000" required></label><label><input id="rule-enabled" type="checkbox" checked> 启用</label></div>
<p id="rule-message" role="status"></p><button id="rule-save">保存关联</button><button type="button" id="rule-close">关闭</button></form></dialog>
<dialog id="review-dialog"><form id="review-form"><h2>记录人工核对</h2><p id="review-target"></p><div class="command-form"><label>核对结论 <select id="review-conclusion"><option value="unknown">仍待核对</option><option value="observed_expected">现场状态符合预期</option><option value="observed_not_expected">现场状态不符合预期</option></select></label><label>操作人 <input id="review-actor" maxlength="80" required></label><label>核对依据 <textarea id="review-note" maxlength="1000" required></textarea></label></div><p id="review-message" role="status"></p><button id="review-save">保存</button><button type="button" id="review-close">关闭</button></form></dialog>
<dialog id="detail-dialog"><h2>指令详情与结案</h2><p id="detail-message" role="status"></p><div id="detail-content" class="command-detail"></div>
<form id="resolve-form" hidden><h3>人工结案，释放旧命令槽位</h3><p>先停止原派发采集进程并核实现场。结案保留原规约阶段，状态仍为未确认；不发送命令。之后如需控制，须通过原控制入口另行提交新命令。</p>
<p id="resolve-blocker"></p><div class="command-form"><label>操作人声明 <input id="resolve-actor" maxlength="80" required></label><label>现场核实和结案依据 <textarea id="resolve-note" maxlength="1000" required></textarea></label></div>
<label><input id="resolve-confirm" type="checkbox" required> 我已核实现场，确认只结案并释放槽位，不重发旧命令</label><p><button id="resolve-save">确认结案</button></p></form>
<button type="button" id="detail-close">关闭</button></dialog>
</body></html>
