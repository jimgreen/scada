<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scdfe_t · 通信监控</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><h1>通信监控</h1></header><main>
<section class="status-grid communication-summary" aria-label="通道状态"><div class="panel"><h2>转发通道</h2><strong id="channel-total">—</strong></div><div class="panel"><h2>正在运行</h2><strong id="channel-running">—</strong></div><div class="panel"><h2>通道异常</h2><strong id="channel-errors">—</strong></div></section>
<section class="panel"><div class="panel-head"><h2>通信状态</h2><div class="actions"><span id="message" class="muted" role="status"></span><button id="refresh">刷新</button></div></div><div class="table-wrap"><table><thead><tr><th>通道</th><th>规约</th><th>监听地址</th><th>状态</th><th>扫描周期</th><th>心跳</th><th>错误</th><th>查看</th></tr></thead><tbody id="communication-rows"></tbody></table></div></section>
</main><script src="/static/communication.js"></script></body></html>
