<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scdfe_t · 通道数据</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><h1>通道数据</h1></header><main>
<section class="toolbar"><button id="new-channel" class="primary">新建通道</button><button id="refresh">刷新</button><label>当前通道<select id="selected-channel"><option value="">请选择</option></select></label><span id="summary" class="muted"></span><span id="toast" role="status"></span></section>
<section class="split"><div class="panel"><div class="panel-head"><h2>转发通道</h2><span id="channel-count" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>编号</th><th>名称</th><th>规约</th><th>状态</th><th>PID</th><th>操作</th></tr></thead><tbody id="channels"></tbody></table></div></div><div class="panel"><div class="panel-head"><h2>通道详情</h2><button id="edit-channel">编辑</button></div><dl id="channel-detail"><dt>通道</dt><dd>未选择</dd></dl></div></section>
</main><dialog id="editor"><form method="dialog" id="editor-form"><div class="dialog-head"><h2 id="editor-title">编辑</h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields" class="form-grid"></div><p id="editor-error" class="error"></p><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<script src="/static/app.js"></script></body></html>
