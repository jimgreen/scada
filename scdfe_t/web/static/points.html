<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scdfe_t · 四遥数据</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><h1>四遥数据</h1></header><main>
<section class="toolbar points-toolbar"><label>当前通道<select id="selected-channel"><option value="">请选择</option></select></label><label class="visually-hidden">数据类型 <select id="kind-filter" aria-hidden="true" tabindex="-1"><option value="yc">遥测 YC</option><option value="yx">遥信 YX</option><option value="yk">遥控 YK</option><option value="yt">遥调 YT</option></select></label><span id="toast" role="status"></span><div class="actions toolbar-actions"><button id="new-point" class="primary">新增测点</button><button id="batch-point">批量加入</button><button id="refresh">刷新</button></div></section>
<section class="panel points-panel"><div class="panel-head"><h2>四遥测点映射</h2></div>
<nav class="tabs point-tabs" aria-label="四遥数据分页" role="tablist">
  <button type="button" id="point-tab-yc" data-point-tab="yc" role="tab" aria-selected="true" aria-controls="point-page-yc" class="active">遥测 YC</button>
  <button type="button" id="point-tab-yx" data-point-tab="yx" role="tab" aria-selected="false" aria-controls="point-page-yx">遥信 YX</button>
  <button type="button" id="point-tab-yk" data-point-tab="yk" role="tab" aria-selected="false" aria-controls="point-page-yk">遥控 YK</button>
  <button type="button" id="point-tab-yt" data-point-tab="yt" role="tab" aria-selected="false" aria-controls="point-page-yt">遥调 YT</button>
</nav>
<div class="point-pages">
  <section class="point-page page active" id="point-page-yc" data-point-page="yc" role="tabpanel"><h3>遥测（YC）</h3><div class="table-wrap"><table><thead><tr data-points-head="yc" id="points-head"><th>类型</th><th>转发点号</th><th>源 RTU</th><th>源点号</th><th>名称</th><th>协议字段</th><th>启用</th><th>操作</th></tr></thead><tbody data-points-body="yc" id="points"></tbody></table></div></section>
  <section class="point-page page" id="point-page-yx" data-point-page="yx" role="tabpanel" hidden><h3>遥信（YX）</h3><div class="table-wrap"><table><thead><tr data-points-head="yx"><th>类型</th><th>转发点号</th><th>源 RTU</th><th>源点号</th><th>名称</th><th>协议字段</th><th>启用</th><th>操作</th></tr></thead><tbody data-points-body="yx"></tbody></table></div></section>
  <section class="point-page page" id="point-page-yk" data-point-page="yk" role="tabpanel" hidden><h3>遥控（YK）</h3><div class="table-wrap"><table><thead><tr data-points-head="yk"><th>类型</th><th>转发点号</th><th>源 RTU</th><th>源点号</th><th>名称</th><th>协议字段</th><th>启用</th><th>操作</th></tr></thead><tbody data-points-body="yk"></tbody></table></div></section>
  <section class="point-page page" id="point-page-yt" data-point-page="yt" role="tabpanel" hidden><h3>遥调（YT）</h3><div class="table-wrap"><table><thead><tr data-points-head="yt"><th>类型</th><th>转发点号</th><th>源 RTU</th><th>源点号</th><th>名称</th><th>协议字段</th><th>启用</th><th>操作</th></tr></thead><tbody data-points-body="yt"></tbody></table></div></section>
</div>
<div class="pager" aria-label="点映射分页"><span id="point-page-summary" class="muted"></span><label>每页<select id="point-limit"><option value="50">50</option><option value="100" selected>100</option><option value="500">500</option></select>条</label><button id="point-prev" disabled>上一页</button><button id="point-next" disabled>下一页</button></div></section>
</main><dialog id="editor"><form method="dialog" id="editor-form"><div class="dialog-head"><h2 id="editor-title">编辑</h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields" class="form-grid"></div><p id="editor-error" class="error"></p><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<script src="/static/app.js"></script></body></html>
