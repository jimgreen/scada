<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scdfe_t · 四遥数据</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><h1>四遥数据</h1></header><main>
<section class="toolbar"><label>当前通道<select id="selected-channel"><option value="">请选择</option></select></label><button id="refresh">刷新</button><span id="toast" role="status"></span></section>
<section class="panel points-panel"><div class="panel-head"><h2>四遥测点映射</h2><div class="actions"><label>数据类型 <select id="kind-filter"><option value="">全部类型</option><option value="yc">遥测 YC</option><option value="yx">遥信 YX</option><option value="yk">遥控 YK</option><option value="yt">遥调 YT</option></select></label><button id="new-point" class="primary">新增测点</button></div></div><div class="table-wrap"><table><thead><tr><th>类型</th><th>转发点号</th><th>源 RTU</th><th>源点号</th><th>名称</th><th>IEC IOA</th><th>Modbus 区/地址</th><th>启用</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div>
<div class="pager" aria-label="点映射分页"><span id="point-page-summary" class="muted"></span><label>每页<select id="point-limit"><option value="50">50</option><option value="100" selected>100</option><option value="500">500</option></select>条</label><button id="point-prev" disabled>上一页</button><button id="point-next" disabled>下一页</button></div></section>
</main><dialog id="editor"><form method="dialog" id="editor-form"><div class="dialog-head"><h2 id="editor-title">编辑</h2><button type="button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields" class="form-grid"></div><p id="editor-error" class="error"></p><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<script src="/static/app.js"></script></body></html>
