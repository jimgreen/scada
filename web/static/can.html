<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCADA · CAN</title><link rel="stylesheet" href="/static/protocol.css"></head><body data-protocol="can"><header><div><h1>CAN 总线主站/测试端</h1><small>CAN 没有通用的服务器角色；本页面管理总线接口、帧收发和四遥映射</small></div><nav><a href="/">SCADA 首页</a>　<a href="/modbus-tcp">Modbus-TCP</a>　<a href="/modbus-rtu">Modbus-RTU</a></nav></header><main><div class="toolbar"><div id="message" class="message"></div><div><button id="start" class="primary">启动总线</button> <button id="stop" class="danger">停止总线</button> <button id="refresh">刷新</button> <button id="poll">采集一次</button></div></div><section class="status-grid" id="status-grid"></section><div class="grid"><div><section class="card"><h2>CAN 接口配置</h2><form id="config-form"><label>RTU 编号<input data-field="rtu_id" type="number" min="1"></label><label>接口类型<input data-field="interface" placeholder="virtual / socketcan / pcan"></label><label>通道<input data-field="channel"></label><label>仲裁段波特率<input data-field="bitrate" type="number" min="1"></label><label>数据段波特率<input data-field="data_bitrate" type="number" min="1"></label><label>CAN-FD<select data-field="fd"><option value="0">否</option><option value="1">是</option></select></label><label>接收自身报文<select data-field="receive_own_messages"><option value="1">是</option><option value="0">否</option></select></label><label>接收超时<input data-field="receive_timeout" type="number" min="0.001" step="0.001"></label><label>默认扩展帧<select data-field="is_extended_id"><option value="0">否</option><option value="1">是</option></select></label><div class="form-actions"><button class="primary">保存配置并按需重载</button></div></form></section><section class="card"><h2>运行状态</h2><pre id="status-json"></pre></section><section class="card"><h2>发送 CAN 帧</h2><form id="frame-form"><label>仲裁 ID<input id="frame-id" type="number" min="0" required></label><label>扩展帧<select id="frame-ext"><option value="0">否</option><option value="1">是</option></select></label><label class="wide">数据 HEX<input id="frame-data" placeholder="01 02 03 04" required></label><div class="form-actions"><button class="primary">发送帧</button></div></form></section></div><div><section class="card"><h2>四遥点定义与实时值</h2><form id="add-point"><label>类型<select id="new-kind"><option>yc</option><option>yx</option><option>yt</option><option>yk</option></select></label><label>点号<input id="new-point" type="number" min="1" required></label><label>名称<input id="new-name"></label><div class="form-actions"><button class="primary">新增点</button></div></form><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>名称</th><th>值</th><th>状态</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section><section class="card"><h2>日志</h2><div id="logs" class="log-list"></div><h2>告警</h2><div id="alerts" class="log-list"></div></section></div></div></main><script src="/static/protocol.js"></script></body></html>
