<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCADA · Modbus-TCP</title><link rel="stylesheet" href="/static/protocol.css"></head><body data-protocol="modbus-tcp"><header><div><h1>Modbus-TCP 测试服务</h1><small>主站连接远端设备，或启动本地 Modbus 从站用于客户端联调</small></div><nav><a href="/">SCADA 首页</a>　<a href="/modbus-rtu">Modbus-RTU</a>　<a href="/can">CAN</a></nav></header><main><div class="toolbar"><div id="message" class="message"></div><div><button id="start" class="primary">启动服务</button> <button id="stop" class="danger">停止服务</button> <button id="refresh">刷新</button> <button id="poll">采集一次</button></div></div><section class="status-grid" id="status-grid"></section><div class="grid"><div><section class="card"><h2>服务配置</h2><form id="config-form"><label>模式<select data-field="mode"><option value="master">主站</option><option value="server">从站服务器</option></select></label><label>RTU 编号<input data-field="rtu_id" type="number" min="1"></label><label>监听地址<input data-field="bind_ip"></label><label>监听端口<input data-field="listen_port" type="number" min="1" max="65535"></label><label>远端主机<input data-field="remote_host"></label><label>远端端口<input data-field="remote_port" type="number" min="1" max="65535"></label><label>从站地址<input data-field="unit_id" type="number" min="1" max="247"></label><label>响应超时<input data-field="response_timeout" type="number" min="0.001" step="0.001"></label><label>连接超时<input data-field="connect_timeout" type="number" min="0.001" step="0.001"></label><label>重试次数<input data-field="retry_count" type="number" min="0"></label><label>保持连接<select data-field="keep_alive"><option value="1">是</option><option value="0">否</option></select></label><div class="form-actions"><button class="primary">保存配置并按需重载</button></div></form></section><section class="card"><h2>运行状态</h2><pre id="status-json"></pre></section></div><div><section class="card"><h2>四遥点定义与实时值</h2><form id="add-point"><label>类型<select id="new-kind"><option>yc</option><option>yx</option><option>yt</option><option>yk</option></select></label><label>点号<input id="new-point" type="number" min="1" required></label><label>名称<input id="new-name"></label><div class="form-actions"><button class="primary">新增点</button></div></form><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>名称</th><th>值</th><th>状态</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section><section class="card"><h2>日志</h2><div id="logs" class="log-list"></div><h2>告警</h2><div id="alerts" class="log-list"></div></section></div></div></main><script src="/static/protocol.js"></script></body></html>
