<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCADA 数据与定义管理</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SCADA / WEB ACCESS</p>
      <h1>数据与定义管理</h1>
      <p class="subtitle">通道、RTU、点表和四遥运行数据</p>
    </div>
    <div class="header-tools"><a href="/api-docs" target="_blank" rel="noopener">接口文档 ↗</a><div class="health" id="health"><span class="dot"></span><span>连接检查中</span></div></div>
  </header>
  <main class="shell">
    <section class="summary" id="summary"></section>
    <section class="workspace">
      <aside class="sidebar">
        <div class="side-title">管理对象</div>
        <button class="nav active" data-resource="rtus"><span>01</span><b>RTU 与通道</b><small>一 RTU 一通道与类型</small></button>
        <button class="nav" data-resource="yc"><span>02</span><b>遥测点表</b><small>模拟量定义与状态</small></button>
        <button class="nav" data-resource="yx"><span>03</span><b>遥信点表</b><small>开关量定义与状态</small></button>
        <button class="nav" data-resource="yt"><span>04</span><b>遥调点表</b><small>设定值定义与状态</small></button>
        <button class="nav" data-resource="yk"><span>05</span><b>遥控点表</b><small>控制量定义与状态</small></button>
        <button class="nav" data-resource="scdfe"><span>06</span><b>scdfe_c 守护进程</b><small>主进程、通信线程与日志</small></button>
        <div class="extra-tables"><label for="extra-table">协议参数与辅助表</label><select id="extra-table"><option value="">选择表…</option></select></div>
        <div class="side-note">数据文件<br><code id="database-path">读取中…</code></div>
      </aside>
      <section class="content">
        <div class="toolbar">
          <div><p class="eyebrow" id="section-kicker">RTU</p><h2 id="section-title">RTU 定义</h2></div>
          <div class="actions">
            <label class="rtu-picker" id="rtu-picker">RTU <input id="rtu-filter" type="text" inputmode="numeric" list="rtu-options" placeholder="全部 RTU" aria-label="筛选 RTU 编号"></label>
            <datalist id="rtu-options"></datalist>
            <input id="search" type="search" placeholder="搜索名称、编码或主键…" aria-label="搜索记录">
            <button class="button secondary" id="refresh">刷新</button>
            <button class="button primary" id="add" disabled>新增记录</button>
          </div>
        </div>
        <div class="hint" id="hint"></div>
        <div class="view-tools"><div class="segments" aria-label="显示字段"><button id="view-common" class="selected">常用字段</button><button id="view-live">四遥数据</button><button id="view-all">全部字段</button></div><label class="refresh-toggle"><input type="checkbox" id="auto-refresh"> 5 秒自动刷新</label><button class="row-button" id="show-schema">表结构</button></div>
        <div id="table-error" class="error-panel" role="alert" hidden></div>
        <div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
        <div class="pager"><span id="result-count"></span><button class="button secondary" id="prev">上一页</button><span id="page"></span><button class="button secondary" id="next">下一页</button></div>
      </section>
    </section>
    <section id="scdfe-panel" class="scdfe-panel" hidden>
      <div class="toolbar"><div><p class="eyebrow">PROCESS CONTROL</p><h2>scdfe_c 守护进程</h2></div><div class="actions"><button class="button primary" id="scdfe-start">启动</button><button class="button secondary" id="scdfe-stop">停止</button><button class="button secondary" id="scdfe-restart">重启通信线程</button><button class="button secondary" id="scdfe-refresh">刷新</button></div></div>
      <div class="scdfe-config" aria-label="scdfe_c 运行参数"><label for="scdfe-worker-delay">通信线程启动间隔</label><input id="scdfe-worker-delay" type="number" min="0" max="60000" step="10" inputmode="numeric"><span>毫秒</span><button class="button secondary" id="scdfe-save-delay">保存间隔</button><label for="scdfe-retention-hours">日志保留</label><input id="scdfe-retention-hours" type="number" min="1" max="87600" step="1" inputmode="numeric"><span>小时</span><button class="button secondary" id="scdfe-save-retention">保存保留时间</button><small>按 RTU-通道顺序启动，避免协议栈同时初始化；日志按进程每小时轮转，超过保留小时数自动删除。</small></div>
      <div id="scdfe-status" class="scdfe-status"></div>
      <div class="scdfe-grid"><section><h3>通信线程</h3><div class="table-wrap"><table><thead><tr><th>RTU</th><th>通道</th><th>规约</th><th>状态</th><th>宿主 PID</th><th>心跳</th><th>错误</th></tr></thead><tbody id="scdfe-rtus"></tbody></table></div></section><section><h3>日志文件</h3><div class="log-tools"><select id="log-process"><option value="">全部进程</option></select></div><div class="table-wrap"><table><thead><tr><th>文件</th><th>进程</th><th>小时</th><th>大小</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="scdfe-logs"></tbody></table></div></section></div>
      <pre id="scdfe-log-content" class="log-content" hidden></pre>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="form-title"><form id="editor-form"><div class="dialog-head"><div><p class="eyebrow" id="form-kicker">新增</p><h2 id="form-title">新增记录</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="关闭编辑窗口">×</button></div><p class="hint">带 * 的字段必填。数值框留空保存为 NULL；主键建立后不能修改。</p><div id="form-fields" class="form-grid"></div><div class="dialog-foot"><span class="form-error" id="form-error" role="alert"></span><button type="button" class="button secondary" id="cancel-editor">取消</button><button type="submit" class="button primary" id="save">保存</button></div></form></dialog>
  <dialog id="schema-dialog" aria-labelledby="schema-title"><div class="schema-content"><div class="dialog-head"><h2 id="schema-title">表结构</h2><button class="icon-button" id="close-schema" aria-label="关闭表结构">×</button></div><pre id="schema-json"></pre></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
