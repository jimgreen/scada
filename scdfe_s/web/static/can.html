<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCADA · CAN</title>
  <link rel="stylesheet" href="/static/protocol.css">
</head>
<body data-protocol="can">
  <header>
    <div>
      <h1>CAN 总线主站</h1>
      <small>管理总线接口、帧收发和四遥映射</small>
    </div>
    <nav>
      <a href="/">SCADA 首页</a>
      <a href="/modbus-tcp">Modbus-TCP 主站</a>
      <a href="/modbus-rtu">Modbus-RTU 主站</a>
      <a href="/can-server">CAN 服务端</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <div id="message" class="message"></div>
      <div>
        <button id="start" class="primary">启动总线</button>
        <button id="stop" class="danger">停止总线</button>
        <button id="refresh">刷新</button>
        <button id="poll">采集一次</button>
      </div>
    </div>

    <div class="page-tabs" role="tablist" aria-label="CAN 主站页面">
      <button type="button" class="page-tab" data-page-tab="config" role="tab" aria-selected="true">通道配置</button>
      <button type="button" class="page-tab" data-page-tab="points" role="tab" aria-selected="false">四遥数据</button>
      <button type="button" class="page-tab" data-page-tab="frames" role="tab" aria-selected="false">报文测试</button>
      <button type="button" class="page-tab" data-page-tab="runtime" role="tab" aria-selected="false">运行状态</button>
      <button type="button" class="page-tab" data-page-tab="logs" role="tab" aria-selected="false">日志与告警</button>
    </div>

    <section class="tab-panel" data-tab-panel="config" role="tabpanel">
      <section class="card">
        <h2>CAN 通道配置</h2>
        <p class="muted">配置接口、通道、仲裁段和数据段波特率后，再启动总线。</p>
        <form id="config-form">
          <label>RTU 编号<input data-field="rtu_id" type="number" min="1"></label>
          <label>接口类型<input data-field="interface" placeholder="virtual / socketcan / pcan"></label>
          <label>通道<input data-field="channel"></label>
          <label>仲裁段波特率<input data-field="bitrate" type="number" min="1"></label>
          <label>数据段波特率<input data-field="data_bitrate" type="number" min="1"></label>
          <label>CAN-FD<select data-field="fd"><option value="0">否</option><option value="1">是</option></select></label>
          <label>接收自身报文<select data-field="receive_own_messages"><option value="1">是</option><option value="0">否</option></select></label>
          <label>接收超时<input data-field="receive_timeout" type="number" min="0.001" step="0.001"></label>
          <label>默认扩展帧<select data-field="is_extended_id"><option value="0">否</option><option value="1">是</option></select></label>
          <div class="form-actions"><button class="primary">保存配置并按需重载</button></div>
        </form>
      </section>
    </section>

    <section class="tab-panel" data-tab-panel="points" role="tabpanel" hidden>
      <section class="card">
        <h2>四遥定义与实时值</h2>
        <form id="add-point">
          <label>类型<select id="new-kind"><option>yc</option><option>yx</option><option>yt</option><option>yk</option></select></label>
          <label>点号<input id="new-point" type="number" min="1" required></label>
          <label>名称<input id="new-name"></label>
          <div class="form-actions"><button class="primary">新增点</button></div>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>类型</th><th>点号</th><th>名称</th><th>值</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="points"></tbody>
          </table>
        </div>
      </section>
    </section>

    <section class="tab-panel" data-tab-panel="frames" role="tabpanel" hidden>
      <section class="card">
        <h2>发送 CAN 报文</h2>
        <p class="muted">用于调试主站报文收发。报文保存开关仍按通道单独控制。</p>
        <form id="frame-form">
          <label>仲裁 ID<input id="frame-id" type="number" min="0" required></label>
          <label>扩展帧<select id="frame-ext"><option value="0">否</option><option value="1">是</option></select></label>
          <label class="wide">数据 HEX<input id="frame-data" placeholder="01 02 03 04" required></label>
          <div class="form-actions"><button class="primary">发送帧</button></div>
        </form>
      </section>
    </section>

    <section class="tab-panel" data-tab-panel="runtime" role="tabpanel" hidden>
      <section class="card">
        <h2>运行状态</h2>
        <section class="status-grid" id="status-grid"></section>
        <pre id="status-json"></pre>
      </section>
    </section>

    <section class="tab-panel" data-tab-panel="logs" role="tabpanel" hidden>
      <div class="grid">
        <section class="card"><h2>运行日志</h2><div id="logs" class="log-list"></div></section>
        <section class="card"><h2>告警</h2><div id="alerts" class="log-list"></div></section>
      </div>
    </section>
  </main>
  <script src="/static/protocol.js"></script>
</body>
</html>
