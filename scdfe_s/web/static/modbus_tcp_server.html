<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCADA · Modbus-TCP 服务端</title><link rel="stylesheet" href="/static/protocol.css"></head><body data-protocol="modbus-tcp-server"><header><div><h1>Modbus-TCP 服务端</h1><small>独立的本地 Modbus-TCP 从站，用于客户端接入和读写联调</small></div><nav><a href="/">SCADA 首页</a>　<a href="/modbus-tcp">Modbus-TCP 通信</a>　<a href="/modbus-rtu-server">Modbus-RTU 服务端</a>　<a href="/can">CAN 通信</a></nav></header><main><div class="toolbar"><div id="message" class="message"></div><div><button id="start" class="primary">启动服务端</button> <button id="stop" class="danger">停止服务端</button> <button id="refresh">刷新</button> <button id="poll">读取一次</button></div></div><section class="status-grid" id="status-grid"></section><div class="grid"><div><section class="card"><h2>服务端监听配置</h2><form id="config-form"><label>RTU 编号<input data-field="rtu_id" type="number" min="1"></label><label>监听地址<input data-field="bind_ip"></label><label>监听端口<input data-field="listen_port" type="number" min="1" max="65535"></label><label>从站地址<input data-field="unit_id" type="number" min="1" max="247"></label><div class="form-actions"><button class="primary">保存服务端配置</button></div></form></section><section class="card"><h2>服务端状态</h2><pre id="status-json"></pre></section></div><div><section class="card"><h2>四遥点定义</h2><form id="add-point"><label>类型<select id="new-kind"><option>yc</option><option>yx</option><option>yt</option><option>yk</option></select></label><label>点号<input id="new-point" type="number" min="1" required></label><label>名称<input id="new-name"></label><div class="form-actions"><button class="primary">新增点</button></div></form><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>名称</th><th>值</th><th>状态</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section><section class="card"><h2>服务端日志</h2><div id="logs" class="log-list"></div><h2>告警</h2><div id="alerts" class="log-list"></div></section></div></div></main><script src="/static/protocol.js"></script></body></html>
