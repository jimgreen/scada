<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCADA · Modbus-RTU</title><link rel="stylesheet" href="/static/protocol.css"></head><body data-protocol="modbus-rtu"><header><div><h1>Modbus-RTU 测试服务</h1><small>主站通信服务：通过串口连接远端 Modbus-RTU 设备，采集并下发数据</small></div><nav><a href="/">SCADA 首页</a>　<a href="/modbus-tcp">Modbus-TCP 通信</a>　<a href="/modbus-rtu-server">Modbus-RTU 服务端</a>　<a href="/can">CAN 通信</a></nav></header><main><div class="toolbar"><div id="message" class="message"></div><div><button id="start" class="primary">启动服务</button> <button id="stop" class="danger">停止服务</button> <button id="refresh">刷新</button> <button id="poll">采集一次</button></div></div><section class="status-grid" id="status-grid"></section><div class="grid"><div><section class="card"><h2>串口与服务配置</h2><form id="config-form"><label>RTU 编号<input data-field="rtu_id" type="number" min="1"></label><label>串口<input data-field="serial_port" placeholder="COM3 或 socket://..."></label><label>波特率<input data-field="baudrate" type="number" min="1"></label><label>数据位<input data-field="bytesize" type="number" min="8" max="8"></label><label>校验<select data-field="parity"><option>N</option><option>E</option><option>O</option></select></label><label>停止位<select data-field="stopbits"><option>1</option><option>2</option></select></label><label>从站地址<input data-field="unit_id" type="number" min="1" max="247"></label><label>响应超时<input data-field="response_timeout" type="number" min="0.001" step="0.001"></label><label>重试次数<input data-field="retry_count" type="number" min="0"></label><div class="form-actions"><button class="primary">保存配置并按需重载</button></div></form></section><section class="card"><h2>运行状态</h2><pre id="status-json"></pre></section></div><div><section class="card"><h2>四遥点定义与实时值</h2><form id="add-point"><label>类型<select id="new-kind"><option>yc</option><option>yx</option><option>yt</option><option>yk</option></select></label><label>点号<input id="new-point" type="number" min="1" required></label><label>名称<input id="new-name"></label><div class="form-actions"><button class="primary">新增点</button></div></form><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>名称</th><th>值</th><th>状态</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section><section class="card"><h2>日志</h2><div id="logs" class="log-list"></div><h2>告警</h2><div id="alerts" class="log-list"></div></section></div></div></main><script src="/static/protocol.js"></script></body></html>
