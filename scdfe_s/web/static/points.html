<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scdfe_s · 四遥数据</title><link rel="stylesheet" href="/static/protocol.css"></head>
<body data-points="1"><header><h1>四遥数据</h1></header><main>
<section class="card">
  <p>这里显示 S 测试库的四遥定义。在这里改点或删点不会修改 C 的同号点。</p>
  <div class="toolbar"><div class="point-filters">
    <label>当前通道<select id="point-rtu"><option value="">请选择通道</option></select></label>
    <label class="visually-hidden">数据类型<select id="kind-filter" aria-hidden="true" tabindex="-1"><option value="yc">遥测 YC</option><option value="yx">遥信 YX</option><option value="yk">遥控 YK</option><option value="yt">遥调 YT</option></select></label>
  </div><button id="reload">刷新</button></div>
  <details class="form-panel" id="point-editor"><summary>新增 / 编辑测点</summary>
    <form id="point-form" class="data-form">
      <label>类型<select id="point-kind"><option value="yc">遥测 YC</option><option value="yx">遥信 YX</option><option value="yk">遥控 YK</option><option value="yt">遥调 YT</option></select></label>
      <label>点号<input id="point-no" type="number" min="1" required></label>
      <label>编码<input id="point-code"></label><label>名称<input id="point-name"></label>
      <label>值<input id="point-value" type="number" step="any" value="0"></label>
      <div class="form-actions"><button class="primary" type="submit">新增测点</button><button type="button" id="update-point">保存测点</button></div>
    </form>
  </details>
  <div id="point-message" class="message" role="status"></div>
  <nav class="page-tabs point-tabs" aria-label="四遥数据分页" role="tablist">
    <button type="button" class="page-tab" id="point-tab-yc" data-point-tab="yc" role="tab" aria-selected="true" aria-controls="point-page-yc">遥测 YC</button>
    <button type="button" class="page-tab" id="point-tab-yx" data-point-tab="yx" role="tab" aria-selected="false" aria-controls="point-page-yx">遥信 YX</button>
    <button type="button" class="page-tab" id="point-tab-yk" data-point-tab="yk" role="tab" aria-selected="false" aria-controls="point-page-yk">遥控 YK</button>
    <button type="button" class="page-tab" id="point-tab-yt" data-point-tab="yt" role="tab" aria-selected="false" aria-controls="point-page-yt">遥调 YT</button>
  </nav>
  <div class="point-pages">
    <section class="point-page tab-panel" id="point-page-yc" data-point-page="yc" role="tabpanel" aria-labelledby="point-tab-yc">
      <h2>遥测（YC）</h2><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>编码</th><th>名称</th><th>值</th><th>操作</th></tr></thead><tbody id="points" data-points-body="yc"></tbody></table></div>
    </section>
    <section class="point-page tab-panel" id="point-page-yx" data-point-page="yx" role="tabpanel" aria-labelledby="point-tab-yx" hidden>
      <h2>遥信（YX）</h2><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>编码</th><th>名称</th><th>值</th><th>操作</th></tr></thead><tbody data-points-body="yx"></tbody></table></div>
    </section>
    <section class="point-page tab-panel" id="point-page-yk" data-point-page="yk" role="tabpanel" aria-labelledby="point-tab-yk" hidden>
      <h2>遥控（YK）</h2><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>编码</th><th>名称</th><th>值</th><th>操作</th></tr></thead><tbody data-points-body="yk"></tbody></table></div>
    </section>
    <section class="point-page tab-panel" id="point-page-yt" data-point-page="yt" role="tabpanel" aria-labelledby="point-tab-yt" hidden>
      <h2>遥调（YT）</h2><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>编码</th><th>名称</th><th>值</th><th>操作</th></tr></thead><tbody data-points-body="yt"></tbody></table></div>
    </section>
  </div>
  <div class="pager" aria-label="四遥数据分页"><span id="point-page-summary"></span><label>每页<select id="point-limit"><option value="50">50</option><option value="100" selected>100</option><option value="500">500</option></select>条</label><button id="point-prev" disabled>上一页</button><button id="point-next" disabled>下一页</button></div>
</section></main><script src="/static/channels.js"></script></body></html>
