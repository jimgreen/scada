<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCADA · CAN 服务端</title><link rel="stylesheet" href="/static/protocol.css"></head><body data-protocol="can-server"><header><div><h1>CAN 服务端</h1><small>独立 CAN/虚拟总线模拟服务端，用于帧收发和四遥点联调</small></div><nav><a href="/">SCADA 首页</a>　<a href="/can">CAN 通信主站</a>　<a href="/opc-server">OPC UA 服务端</a>　<a href="/bacnet-server">BACnet/IP 服务端</a></nav></header><main><div class="toolbar"><div id="message" class="message"></div><div><button id="start" class="primary">启动服务端</button> <button id="stop" class="danger">停止服务端</button> <button id="refresh">刷新</button> <button id="poll">接收一次</button></div></div><section class="status-grid" id="status-grid"></section><div class="grid"><div><section class="card"><h2>CAN 服务端配置</h2><form id="config-form"><label>RTU 编号<input data-field="rtu_id" type="number" min="1"></label><label>接口<input data-field="interface"></label><label>通道<input data-field="channel"></label><label>仲裁波特率<input data-field="bitrate" type="number"></label><label>数据波特率<input data-field="data_bitrate" type="number"></label><label>请求帧 ID<input data-field="request_id" type="number" min="0"></label><label>应答帧 ID<input data-field="response_id" type="number" min="0"></label><label>应答数据<input data-field="response_data" placeholder="01 00"></label><label>模拟模式<input data-field="simulation" type="checkbox"></label><div class="form-actions"><button class="primary">保存配置</button></div></form></section><section class="card"><h2>服务端状态</h2><pre id="status-json"></pre></section></div><div><section class="card"><h2>四遥点定义</h2><form id="add-point"><label>类型<select id="new-kind"><option>yc</option><option>yx</option><option>yt</option><option>yk</option></select></label><label>点号<input id="new-point" type="number" min="1" required></label><label>名称<input id="new-name"></label><div class="form-actions"><button class="primary">新增点</button></div></form><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>名称</th><th>值</th><th>状态</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section><section class="card"><h2>发送 CAN 帧</h2><form id="frame-form"><label>帧 ID<input id="frame-id" type="number" value="256"></label><label>数据<input id="frame-data" value="01 00"></label><label>扩展帧<input id="frame-ext" type="number" min="0" max="1" value="0"></label><div class="form-actions"><button class="primary">发送</button></div></form></section><section class="card"><h2>服务端日志</h2><div id="logs" class="log-list"></div><h2>告警</h2><div id="alerts" class="log-list"></div></section></div></div></main><script src="/static/protocol.js"></script></body></html>
