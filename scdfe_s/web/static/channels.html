<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scdfe_s · 通道数据</title><link rel="stylesheet" href="/static/protocol.css"></head>
<body data-channels="1"><header><h1>通道数据</h1></header>
<main><section class="card">
  <p>这里管理 S 测试库的通道和各规约参数。通信测试页面只浏览配置；与 C 同号的站独立保存，删除不会删除 C 的站。</p>
  <div class="toolbar"><h2>通道列表</h2><div class="actions"><button id="new-channel" class="primary" type="button">新建通道</button><button id="edit-parameters" type="button" disabled>编辑规约参数</button><button id="reload" type="button">刷新</button></div></div>
  <dialog class="editor-dialog" id="channel-editor" aria-labelledby="channel-editor-title">
    <form id="channel-form" class="data-form" method="dialog">
      <div class="dialog-head"><h2 id="channel-editor-title">新建通道</h2><button type="button" id="close-channel-editor" aria-label="关闭">×</button></div>
      <div class="dialog-fields">
      <label>RTU 编号<input id="rtu_id" type="number" min="1" required></label>
      <label>通道编号<input id="channel_id" type="number" min="1" required></label>
      <label>规约<select id="channel_type"><option>iec104</option><option>modbus-tcp</option><option>modbus-rtu</option><option>can</option><option>bacnet</option><option>opc</option></select></label>
      <label>编码<input id="code"></label><label>名称<input id="name"></label>
      <label>保存报文<select id="packet_recording"><option value="0">关闭</option><option value="1">开启</option></select></label>
      <label>自动通信<select id="process_enable"><option value="1">启用</option><option value="0">停用</option></select></label>
      </div><p id="channel-editor-error" class="error"></p><div class="form-actions"><button type="button" id="cancel-channel-editor">取消</button><button class="primary" id="create-channel-submit" type="submit">新建通道</button><button type="button" id="update-channel" hidden>保存修改</button></div>
    </form>
  </dialog>
  <dialog class="editor-dialog parameter-editor" id="parameter-editor" aria-labelledby="parameter-editor-title">
    <form id="parameter-form" class="data-form" method="dialog">
      <div class="dialog-head"><h2 id="parameter-editor-title">规约参数</h2><button type="button" id="close-parameter-editor" aria-label="关闭">×</button></div>
    <p id="parameter-help" class="muted">请先在通道列表中选择“编辑”。</p>
      <div id="parameter-fields" class="parameter-fields"></div>
      <div class="form-actions"><button type="button" id="cancel-parameter-editor">取消</button><button class="primary" id="save-parameters" type="submit">保存规约参数</button><button type="button" id="delete-parameters" class="danger" hidden>删除规约参数</button></div>
    </form>
  </dialog>
  <div id="channel-message" class="message" role="status"></div>
  <div class="table-wrap"><table><thead><tr><th>RTU</th><th>通道</th><th>规约</th><th>名称</th><th>自动通信</th><th>操作</th></tr></thead><tbody id="channels"></tbody></table></div>
</section></main><script src="/static/channels.js"></script></body></html>
