<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scdfe_s · 通道数据</title><link rel="stylesheet" href="/static/protocol.css"></head>
<body data-channels="1"><header><h1>通道数据</h1></header>
<main><section class="card">
  <div class="toolbar"><h2>通道列表</h2><button id="reload">刷新</button></div>
  <details class="form-panel" id="channel-editor"><summary>新增 / 编辑通道</summary>
    <form id="channel-form" class="data-form">
      <label>RTU 编号<input id="rtu_id" type="number" min="1" required></label>
      <label>通道编号<input id="channel_id" type="number" min="1" required></label>
      <label>规约<select id="channel_type"><option>iec104</option><option>modbus-tcp</option><option>modbus-rtu</option><option>can</option><option>bacnet</option><option>opc</option></select></label>
      <label>编码<input id="code"></label><label>名称<input id="name"></label>
      <label>自动通信<select id="process_enable"><option value="1">启用</option><option value="0">停用</option></select></label>
      <div class="form-actions"><button class="primary" type="submit">新建通道</button><button type="button" id="update-channel">保存修改</button></div>
    </form>
  </details>
  <div id="channel-message" class="message" role="status"></div>
  <div class="table-wrap"><table><thead><tr><th>RTU</th><th>通道</th><th>规约</th><th>名称</th><th>报文保存</th><th>自动通信</th><th>操作</th></tr></thead><tbody id="channels"></tbody></table></div>
</section></main><script src="/static/packet-recording.js"></script><script src="/static/channels.js"></script></body></html>
