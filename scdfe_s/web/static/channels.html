<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCADA · 通道与测点</title><link rel="stylesheet" href="/static/protocol.css"></head>
<body data-channels="1"><header><div><h1>SCADA 通道与测点</h1><small>多 RTU 通道及四遥点定义维护</small></div><nav><a href="/">通信测试</a><a href="/processes">进程监控</a><a href="/communication">通信监控</a><a href="/logs">运行日志</a></nav></header>
<main><div class="grid"><section class="card"><div class="toolbar"><h2>通道列表</h2><button id="reload" class="primary">刷新</button></div><form id="channel-form"><label>RTU 编号<input id="rtu_id" type="number" min="1" required></label><label>通道编号<input id="channel_id" type="number" min="1" required></label><label>规约<select id="channel_type"><option>iec104</option><option>modbus-tcp</option><option>modbus-rtu</option><option>can</option><option>bacnet</option><option>opc</option></select></label><label>编码<input id="code"></label><label>名称<input id="name"></label><label>自动通信<select id="process_enable"><option value="1">启用</option><option value="0">停用</option></select></label><div class="form-actions"><button class="primary" type="submit">新建通道</button><button type="button" id="update-channel">保存修改</button></div></form><div id="channel-message" class="message"></div><div class="table-wrap"><table><thead><tr><th>RTU</th><th>通道</th><th>规约</th><th>名称</th><th>状态</th><th>操作</th></tr></thead><tbody id="channels"></tbody></table></div></section>
<section class="card"><div class="toolbar"><h2>通道内四遥测点</h2><span id="selected-channel" class="muted">未选择通道</span></div><form id="point-form"><label>类型<select id="point-kind"><option>yc</option><option>yx</option><option>yk</option><option>yt</option></select></label><label>点号<input id="point-no" type="number" min="1" required></label><label>编码<input id="point-code"></label><label>名称<input id="point-name"></label><label>值<input id="point-value" type="number" step="any" value="0"></label><div class="form-actions"><button class="primary" type="submit">新增测点</button><button type="button" id="update-point">保存测点</button></div></form><div id="point-message" class="message"></div><div class="table-wrap"><table><thead><tr><th>类型</th><th>点号</th><th>编码</th><th>名称</th><th>值</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section></div></main>
<script src="/static/channels.js"></script></body></html>
