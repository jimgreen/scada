<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scdfe_d · 设备量测</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/point-trend.css"></head>
<body><header></header><main>
<p id="alert" role="alert" hidden></p>
<section id="overview-stats" class="stats" aria-label="采集概况" hidden><div><strong id="device-count">—</strong><span>设备</span></div><div><strong id="property-count">—</strong><span>量测属性</span></div><div><strong id="mapping-count">—</strong><span>点表映射</span></div><div><strong id="valid-count">—</strong><span>可用量测</span></div></section>
<section id="overview" class="panel" hidden>
<div class="toolbar">
<h2>设备量测采集</h2><span id="collector-state" class="badge">未启动</span>
<form id="interval-form" class="interval-form">
<label>采集周期（秒）<input id="interval" type="number" min="1" max="60" step="1" value="5" required disabled aria-describedby="interval-effective interval-feedback interval-error"></label>
<button type="submit" id="interval-save" disabled>保存周期</button>
<span id="interval-effective" class="muted"></span>
<span id="interval-feedback" class="muted" role="status"></span>
</form>
<div class="actions"><button id="collect-once" disabled>采集一次</button><button id="collect-start" class="primary" disabled>启动采集</button><button id="collect-stop" disabled>停止采集</button></div>
</div>
<div id="interval-error" class="error" role="alert" hidden></div>
<div id="last-refresh" class="muted"></div><div id="collector-error" role="alert"></div>
<div class="table-wrap"><table><thead><tr><th>设备类型</th><th>设备数</th><th>设备量测</th></tr></thead><tbody id="category-rows"></tbody></table></div>
</section>
<section id="measure-panel" class="panel flexible" hidden>
<div class="toolbar filters">
<label>设备类型<select id="category"><option value="">全部类型</option></select></label>
<label>设备表<select id="model-table"><option value="">全部设备表</option></select></label>
<label>设备<select id="device"><option value="">全部设备</option></select></label>
<input id="search" type="search" placeholder="按属性名称过滤" aria-label="按属性名称过滤">
<label class="check"><input id="only-invalid" type="checkbox">仅不可用</label>
<div class="actions" id="definition-actions"><button id="import-model">导入设备模型</button><button id="new-device">新增设备</button><button id="new-measurement" class="primary">新增属性映射</button></div>
<button id="refresh">刷新</button></div>
<div class="toolbar type-tabs" role="group" aria-label="量测类型"><button id="tab-all" aria-pressed="true" class="active">全部</button><button id="tab-yc" aria-pressed="false">遥测 YC</button><button id="tab-yx" aria-pressed="false">遥信 YX</button><span class="muted" id="table-hint"></span><label class="check actions" id="live-refresh"><input id="auto-refresh" type="checkbox" checked>5 秒刷新</label></div>
<div class="toolbar" id="parameter-selection" hidden><span id="parameter-selection-count" class="muted" aria-live="polite"></span><button id="bulk-parameters" disabled>批量设置</button><label id="draft-filter" class="check" hidden><input id="only-draft" type="checkbox">仅看待保存</label></div>
<div class="table-wrap"><table><thead id="measure-head"></thead><tbody id="measure-rows"></tbody></table></div>
<div class="pager"><span id="page-summary"></span><div class="actions" id="page-actions"><button id="previous">上一页</button><span id="page-number"></span><button id="next">下一页</button></div>
<div class="actions" id="parameter-actions" hidden><span id="parameter-status" aria-live="polite"></span><button id="discard-parameters" disabled>撤销修改</button><button id="save-parameters" class="primary" disabled>保存参数</button></div></div>
<div id="point-trend" hidden></div></section>
<section id="history-panel" class="panel flexible" hidden><div class="toolbar"><h2>采集与修改记录</h2><button id="history-refresh" class="actions">刷新</button></div><div class="type-tabs"><button id="show-refreshes" class="active">采集批次</button><button id="show-changes">定义修改</button></div><div class="table-wrap"><table><thead id="history-head"></thead><tbody id="history-rows"></tbody></table></div></section>
</main>
<dialog id="bulk-parameter-editor" aria-labelledby="bulk-parameter-title">
  <form id="bulk-parameter-form">
    <h2 id="bulk-parameter-title">批量设置量测参数</h2>
    <p id="bulk-parameter-scope" class="muted"></p>
    <ul id="bulk-parameter-items" aria-label="选中的量测"></ul>
    <div class="two">
      <label>采集映射<select id="bulk-enabled"><option value="">保持原值</option><option value="1">启用</option><option value="0">停用</option></select></label>
      <label>量测可用状态<select id="bulk-notuse"><option value="">保持原值</option><option value="0">使用</option><option value="1">禁用</option></select></label>
      <label>权重<input type="number" step="any" id="bulk-weight" placeholder="保持原值"></label>
      <label>超时阈值（秒）<input type="number" step="any" id="bulk-max_age_seconds" placeholder="保持原值"></label>
    </div>
    <p id="bulk-parameter-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="bulk-parameter-cancel">取消</button><button type="submit" class="primary">加入待保存修改</button></div>
  </form>
</dialog>
<dialog id="mapping-editor"><form id="mapping-form"><div class="toolbar"><h2 id="editor-title">属性映射</h2><button type="button" id="editor-close" class="actions" aria-label="关闭映射编辑">×</button></div>
<div class="editor-grid"><section><h3>目标设备属性</h3><label>设备<select id="edit-device" required></select></label><div class="two"><label>属性名<input id="edit-metric" required pattern="[a-z][a-z0-9_]{0,47}" placeholder="p / q / v / soc"></label><label>点类型<select id="edit-kind"><option value="yc">遥测 YC</option><option value="yx">遥信 YX</option></select></label></div><label>属性名称<input id="edit-name" required></label><div class="two"><label>单位<input id="edit-unit"></label><label>权重<input id="edit-weight" type="number" min="0.000001" step="any" value="1" required></label><label>比例<input id="edit-scale" type="number" step="any" value="1" required></label><label>偏移<input id="edit-offset" type="number" step="any" value="0" required></label></div><label>超时阈值（秒）<input id="edit-age" type="number" min="0.1" step="any" value="120" required></label><div class="toolbar"><label class="check"><input id="edit-enabled" type="checkbox" checked>启用采集映射</label><label class="check"><input id="edit-notuse" type="checkbox">禁用量测（notuse）</label></div></section>
<section class="source-section"><h3>源 SCADA 测点</h3><label>源数据库<span class="source-path"><input id="edit-source" required placeholder="realtime/qinling/sqldb/scada/scdfe_c.sqlite3"><button type="button" id="browse-source">浏览</button></span></label><div class="two"><label>RTU 编号<input id="edit-rtu" type="number" min="1" required></label><label>点号<input id="edit-point" type="number" min="0" required></label></div><div class="toolbar"><input id="source-search" type="search" placeholder="按测点名称查找" aria-label="按源测点名称查找"><button type="button" id="find-source">查找测点</button></div><p id="source-message" class="muted" role="status"></p><div class="table-wrap source-results"><table><thead><tr><th>RTU / 点号</th><th>测点名称</th><th></th></tr></thead><tbody id="source-rows"></tbody></table></div><div class="pager"><button type="button" id="source-prev">上一页</button><span id="source-page"></span><button type="button" id="source-next">下一页</button></div></section></div>
<p id="editor-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="editor-cancel">取消</button><button id="editor-save" type="submit" class="primary">保存映射</button></div></form></dialog>
<dialog id="device-editor"><form id="device-form"><h2>新增设备</h2><label>设备名称<input id="device-name" required maxlength="200"></label><label>设备类型<select id="device-category"></select></label><p id="device-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="device-cancel">取消</button><button type="submit" class="primary">创建</button></div></form></dialog>
<dialog id="source-browser"><h2 id="source-browser-title">选择源数据库</h2><div class="toolbar"><button id="source-up">上一级</button><button id="source-root">工作区根目录</button><button id="source-close" class="actions">关闭</button></div><p id="source-folder" class="muted"></p><p id="browser-error" class="error" role="alert" hidden></p><div id="source-files"></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><div class="dialog-actions"><button type="button" id="confirm-cancel" autofocus>取消</button><button type="button" id="confirm-ok" class="danger">确认</button></div></form></dialog>
<script src="/static/point-trend.js"></script><script src="/static/app.js"></script></body></html>
