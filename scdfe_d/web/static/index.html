<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scdfe_d · 设备量测</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/point-trend.css"></head>
<body><header></header><main>
<p id="alert" role="alert" hidden></p>
<section id="overview-stats" class="stats stats-compact" aria-label="采集概况" hidden><div><span>设备</span><strong id="device-count">—</strong></div><div><span>量测属性</span><strong id="property-count">—</strong></div><div><span>点表映射</span><strong id="mapping-count">—</strong></div><div><span>可用量测</span><strong id="valid-count">—</strong></div><div><span>指令点</span><strong id="control-count">—</strong></div></section>
<section id="overview" class="panel" hidden>
<div class="toolbar overview-bar">
<span id="collector-state" class="badge">未启动</span>
<form id="interval-form" class="interval-form">
<label>采集周期（秒）<input id="interval" type="number" min="1" max="60" step="1" value="5" required disabled aria-describedby="interval-effective interval-feedback interval-error"></label>
<button type="submit" id="interval-save" disabled>保存周期</button>
<span id="interval-effective" class="muted"></span>
<span id="interval-feedback" class="muted" role="status"></span>
</form>
<span id="last-refresh" class="muted"></span>
<div class="actions"><button id="collect-once" disabled>采集一次</button><button id="collect-start" class="primary" disabled>启动采集</button><button id="collect-stop" disabled>停止采集</button></div>
</div>
<div id="interval-error" class="error" role="alert" hidden></div>
<div id="collector-error" role="alert"></div>
<div class="table-wrap"><table><thead><tr><th>设备类型</th><th>设备数</th><th>量测有效 / 绑定</th><th>指令点</th><th>操作</th></tr></thead><tbody id="category-rows"></tbody></table></div>
<div id="overview-recent-ctrl" class="overview-recent-ctrl" hidden><div class="recent-ctrl-head"><span>最近指令流水</span><a href="/controls">进入指令下发 →</a></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>设备</th><th>属性</th><th>设定值</th><th>状态</th></tr></thead><tbody id="overview-ctrl-rows"></tbody></table></div></div>
</section>
<section id="measure-panel" class="panel flexible" hidden>
<div class="toolbar filters measure-bar">
<div class="type-tabs" id="measure-view-switch" role="group" aria-label="量测视图模式" hidden><button type="button" id="switch-live-view">实时监视</button><button type="button" id="switch-param-view">批量调参</button></div>
<select id="category" aria-label="设备类型" title="设备类型"><option value="">全部类型</option></select>
<select id="model-table" aria-label="设备表" title="设备表"><option value="">全部设备表</option></select>
<select id="device" aria-label="设备" title="设备"><option value="">全部设备</option></select>
<input id="search" type="search" placeholder="过滤属性" aria-label="按属性名称过滤" title="按属性名称过滤">
<label class="check"><input id="only-invalid" type="checkbox">仅不可用</label>
<div class="type-tabs" role="group" aria-label="量测类型"><button id="tab-all" aria-pressed="true" class="active">全部</button><button id="tab-yc" aria-pressed="false" title="遥测 YC">YC</button><button id="tab-yx" aria-pressed="false" title="遥信 YX">YX</button></div>
<div class="actions measure-bar-actions">
<div class="inline-group" id="parameter-selection" hidden><span id="parameter-selection-count" class="muted" aria-live="polite"></span><button id="bulk-parameters" disabled>批量设置</button><label id="draft-filter" class="check" hidden><input id="only-draft" type="checkbox">仅看待保存</label></div>
<label class="check" id="live-refresh"><input id="auto-refresh" type="checkbox" checked>5s 刷新</label>
<div class="actions" id="definition-actions"><button id="sync-meas-bindings" title="按表名.设备名.属性从源库自动匹配绑定">同步绑定</button><button id="export-meas-csv" title="导出当前量测映射为 CSV">导出 CSV</button><button id="import-model" title="导入设备模型">导入模型</button><button id="new-device">新增设备</button><button id="new-measurement" class="primary" title="新增属性映射">新增映射</button></div>
<button id="refresh">刷新</button>
</div>
</div>
<div class="table-wrap"><table><thead id="measure-head"></thead><tbody id="measure-rows"></tbody></table></div>
<div class="pager"><span id="page-summary"></span><div class="actions" id="page-actions"><button id="previous">上一页</button><span id="page-number"></span><button id="next">下一页</button></div>
<div class="actions" id="parameter-actions" hidden><span id="parameter-status" aria-live="polite"></span><button id="discard-parameters" disabled>撤销修改</button><button id="save-parameters" class="primary" disabled>保存参数</button></div></div>
<div id="point-trend" hidden></div></section>
<section id="history-panel" class="panel flexible" hidden><div class="toolbar history-bar"><h2>采集与修改记录</h2><div class="type-tabs"><button id="show-refreshes" class="active">采集批次</button><button id="show-changes">定义修改</button><button id="show-controls">指令流水</button></div><button id="history-refresh" class="actions">刷新</button></div><div class="table-wrap"><table><thead id="history-head"></thead><tbody id="history-rows"></tbody></table></div></section>
<section id="control-panel" class="panel flexible" hidden>
<div class="toolbar filters control-bar">
<select id="ctrl-category" aria-label="设备类型" title="设备类型"><option value="">全部类型</option></select>
<select id="ctrl-table" aria-label="设备表" title="设备表"><option value="">全部设备表</option></select>
<input id="ctrl-search" type="search" placeholder="设备 / 属性" aria-label="搜索设备或指令属性" title="搜索设备或指令属性">
<div class="type-tabs" role="group" aria-label="指令类型"><button id="ctrl-tab-all" aria-pressed="true" class="active">全部</button><button id="ctrl-tab-yk" aria-pressed="false" title="遥控 YK">YK</button><button id="ctrl-tab-yt" aria-pressed="false" title="遥调 YT">YT</button></div>
<select id="ctrl-status" aria-label="执行状态" title="执行状态"><option value="">全部状态</option><option value="0">空闲</option><option value="1">待回执</option><option value="2">执行成功</option><option value="3">执行失败</option><option value="5">控制禁用</option></select>
<div class="actions control-bar-actions">
<span id="ctrl-summary" class="muted" aria-live="polite"></span>
<label class="check" id="ctrl-live-wrap"><input id="ctrl-auto-refresh" type="checkbox" checked>5s 刷新</label>
<button id="sync-ctrl-bindings" hidden title="按表名.设备名.属性从 scdfe_c 自动匹配绑定 YK/YT">同步绑定</button>
<button id="export-ctrl-csv" hidden title="导出指令映射为 CSV">导出 CSV</button>
<button id="new-control" class="primary" hidden>新增指令映射</button>
<button id="ctrl-refresh">刷新</button>
</div>
</div>
<div class="table-wrap"><table><thead id="control-head"></thead><tbody id="control-rows"></tbody></table></div>
<div class="pager"><span id="ctrl-page-summary"></span><div class="actions"><button id="ctrl-prev">上一页</button><span id="ctrl-page-number"></span><button id="ctrl-next">下一页</button></div></div>
<details id="control-history-drawer" class="control-history-drawer" hidden>
<summary><span>指令下发与回执流水</span><span id="ctrl-history-count" class="muted"></span></summary>
<div class="table-wrap drawer-table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>设备</th><th>属性</th><th>类型</th><th>RTU / 点号</th><th>设定值</th><th>状态</th><th>详情</th></tr></thead><tbody id="ctrl-history-rows"></tbody></table></div>
</details>
</section>
<section id="logs-panel" class="panel flexible" hidden>
<div class="toolbar logs-bar">
<div class="type-tabs" id="logs-section-tabs" role="group" aria-label="日志与记录切换"><button type="button" class="active" data-log-tab="files">文件日志</button><button type="button" data-log-tab="controls">指令流水</button><button type="button" data-log-tab="refreshes">采集批次</button><button type="button" data-log-tab="changes">定义修改</button></div>
<select id="log-process" aria-label="进程" title="进程"><option value="">全部进程</option><option value="scdfe_d-control">指令监视 (control)</option><option value="scdfe_d-collector">量测采集 (collector)</option><option value="scdfe_d-web">Web 服务 (web)</option></select>
<select id="log-level" aria-label="级别" title="级别"><option value="">全部级别</option><option value="INFO">INFO</option><option value="WARNING">WARNING</option><option value="ERROR">ERROR</option><option value="PROCESS">PROCESS</option></select>
<select id="log-file" aria-label="日志文件" title="日志文件"><option value="">全部小时文件</option></select>
<input id="log-search" type="search" placeholder="搜索日志关键词" aria-label="搜索日志关键词" title="搜索日志关键词">
<div class="actions logs-bar-actions">
<span id="log-meta" class="muted" aria-live="polite"></span>
<label class="check"><input id="log-auto-refresh" type="checkbox" checked>5s 刷新</label>
<button id="log-export">导出</button>
<button id="log-refresh" class="primary">刷新</button>
</div>
</div>
<div class="table-wrap logs-table-wrap" id="logs-file-wrap"><table class="logs-table"><thead><tr><th>时间</th><th>级别</th><th>进程</th><th>日志内容</th></tr></thead><tbody id="log-rows"></tbody></table></div>
<div class="table-wrap" id="logs-history-wrap" hidden><table><thead id="logs-history-head"></thead><tbody id="logs-history-rows"></tbody></table></div>
<div class="pager" id="logs-file-pager"><span id="log-summary"></span><div class="actions"><button id="log-more" hidden>加载更早日志</button></div></div>
</section>
</main>
<dialog id="control-editor"><form id="control-form"><div class="toolbar"><h2 id="ctrl-editor-title">指令映射</h2><button type="button" id="ctrl-editor-close" class="actions" aria-label="关闭指令编辑">×</button></div>
<div class="editor-grid"><section><h3>目标设备指令</h3>
<label>设备<select id="ctrl-edit-device" required></select></label>
<div class="two">
<label>指令属性<input id="ctrl-edit-attr" list="ctrl-attr-presets" required pattern="[a-z][a-z0-9_]{0,47}" placeholder="run_stat / p_set"></label>
<label>指令类型<select id="ctrl-edit-kind"><option value="yk">遥控 YK</option><option value="yt">遥调 YT</option></select></label>
</div>
<datalist id="ctrl-attr-presets"><option value="run_stat"><option value="status"><option value="p_set"><option value="q_set"><option value="v_set"><option value="i_set"><option value="p_ac_set"><option value="q_ac_set"><option value="v_ac_set"><option value="p_dc_set"><option value="v_dc_set"><option value="flow_set"></datalist>
<div class="two">
<label>设定下限<input id="ctrl-edit-min" type="number" step="any" placeholder="留空不设限"></label>
<label>设定上限<input id="ctrl-edit-max" type="number" step="any" placeholder="留空不设限"></label>
</div>
<div class="toolbar"><label class="check"><input id="ctrl-edit-notuse" type="checkbox">禁用控制（闭锁）</label></div>
</section>
<section class="source-section"><h3>目标 scdfe_c 指令点</h3>
<label>源数据库<span class="source-path"><input id="ctrl-edit-source" required placeholder="realtime/qinling/sqldb/fes/scdfe_c.db"><button type="button" id="ctrl-browse-source">浏览</button></span></label>
<div class="two">
<label>RTU 编号<input id="ctrl-edit-rtu" type="number" min="1" required></label>
<label>点号<input id="ctrl-edit-point" type="number" min="1" required></label>
</div>
<div class="toolbar"><input id="ctrl-source-search" type="search" placeholder="按测点名称查找" aria-label="按指令点名称查找"><button type="button" id="ctrl-find-source">查找测点</button></div>
<p id="ctrl-source-message" class="muted" role="status"></p>
<div class="table-wrap source-results"><table><thead><tr><th>RTU / 点号</th><th>测点名称</th><th></th></tr></thead><tbody id="ctrl-source-rows"></tbody></table></div>
<div class="pager"><button type="button" id="ctrl-source-prev">上一页</button><span id="ctrl-source-page"></span><button type="button" id="ctrl-source-next">下一页</button></div>
</section></div>
<p id="ctrl-editor-error" class="error" role="alert" hidden></p>
<div class="dialog-actions"><button type="button" id="ctrl-editor-cancel">取消</button><button id="ctrl-editor-save" type="submit" class="primary">保存映射</button></div>
</form></dialog>
<dialog id="bulk-parameter-editor" aria-labelledby="bulk-parameter-title">
  <form id="bulk-parameter-form">
    <h2 id="bulk-parameter-title">批量设置量测参数</h2>
    <p id="bulk-parameter-scope" class="muted"></p>
    <ul id="bulk-parameter-items" aria-label="选中的量测"></ul>
    <div class="two">
      <label>采集映射<select id="bulk-enabled"><option value="">保持原值</option><option value="1">启用</option><option value="0">停用</option></select></label>
      <label>量测可用状态<select id="bulk-notuse"><option value="">保持原值</option><option value="0">使用</option><option value="1">禁用</option></select></label>
      <label>权重<input type="number" step="any" id="bulk-weight" placeholder="保持原值"></label>
      <label>超时阈值（秒）<input type="number" step="any" id="bulk-max_age_seconds" placeholder="保持原值"></label>
      <label>量测下限<input type="number" step="any" id="bulk-min_value" placeholder="保持原值"></label>
      <label>量测上限<input type="number" step="any" id="bulk-max_value" placeholder="保持原值"></label>
    </div>
    <p id="bulk-parameter-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="bulk-parameter-cancel">取消</button><button type="submit" class="primary">加入待保存修改</button></div>
  </form>
</dialog>
<dialog id="mapping-editor"><form id="mapping-form"><div class="toolbar"><h2 id="editor-title">属性映射</h2><button type="button" id="editor-close" class="actions" aria-label="关闭映射编辑">×</button></div>
<div class="editor-grid"><section><h3>目标设备属性</h3><label>设备<select id="edit-device" required></select></label><div class="two"><label>属性名<input id="edit-metric" required pattern="[a-z][a-z0-9_]{0,47}" placeholder="p / q / v / soc"></label><label>点类型<select id="edit-kind"><option value="yc">遥测 YC</option><option value="yx">遥信 YX</option></select></label></div><label>属性名称<input id="edit-name" required></label><div class="two"><label>单位<input id="edit-unit"></label><label>权重<input id="edit-weight" type="number" min="0.000001" step="any" value="1" required></label><label>量测下限<input id="edit-min" type="number" step="any" placeholder="留空不设限"></label><label>量测上限<input id="edit-max" type="number" step="any" placeholder="留空不设限"></label><label>比例<input id="edit-scale" type="number" step="any" value="1" required></label><label>偏移<input id="edit-offset" type="number" step="any" value="0" required></label></div><label>超时阈值（秒）<input id="edit-age" type="number" min="0.1" step="any" value="120" required></label><div class="toolbar"><label class="check"><input id="edit-enabled" type="checkbox" checked>启用采集映射</label><label class="check"><input id="edit-notuse" type="checkbox">禁用量测</label></div></section>
<section class="source-section"><h3>源 SCADA 测点</h3><label>源数据库<span class="source-path"><input id="edit-source" required placeholder="realtime/qinling/sqldb/fes/scdfe_c.db"><button type="button" id="browse-source">浏览</button></span></label><div class="two"><label>RTU 编号<input id="edit-rtu" type="number" min="1" required></label><label>点号<input id="edit-point" type="number" min="1" required></label></div><div class="toolbar"><input id="source-search" type="search" placeholder="按测点名称查找" aria-label="按源测点名称查找"><button type="button" id="find-source">查找测点</button></div><p id="source-message" class="muted" role="status"></p><div class="table-wrap source-results"><table><thead><tr><th>RTU / 点号</th><th>测点名称</th><th></th></tr></thead><tbody id="source-rows"></tbody></table></div><div class="pager"><button type="button" id="source-prev">上一页</button><span id="source-page"></span><button type="button" id="source-next">下一页</button></div></section></div>
<p id="editor-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="editor-cancel">取消</button><button id="editor-save" type="submit" class="primary">保存映射</button></div></form></dialog>
<dialog id="device-editor"><form id="device-form"><h2>新增设备</h2><label>设备名称<input id="device-name" required maxlength="200"></label><label>设备类型<select id="device-category"></select></label><p id="device-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="device-cancel">取消</button><button type="submit" class="primary">创建</button></div></form></dialog>
<dialog id="source-browser"><h2 id="source-browser-title">选择源数据库</h2><div class="toolbar"><button id="source-up">上一级</button><button id="source-root">工作区根目录</button><button id="source-close" class="actions">关闭</button></div><p id="source-folder" class="muted"></p><p id="browser-error" class="error" role="alert" hidden></p><div id="source-files"></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><div class="dialog-actions"><button type="button" id="confirm-cancel" autofocus>取消</button><button type="button" id="confirm-ok" class="danger">确认</button></div></form></dialog>
<script src="/static/point-trend.js"></script><script src="/static/app.js"></script></body></html>
