  <style>

    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Microsoft YaHei",Segoe UI,Arial,sans-serif;min-width:1100px}

    .topbar{height:62px;background:#10233d;color:#fff;padding:0 22px;display:flex;align-items:center;gap:24px;box-shadow:0 2px 8px #10233d35}.brand{font-size:20px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px}.brand small{font-size:11px;font-weight:400;color:#b8c8df;border:1px solid #5f7598;border-radius:10px;padding:2px 7px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button{background:#1b3557;color:#eaf2ff;border-color:#365579}.toolbar button:hover{background:#284b78}.toolbar button.primary{background:#3b82f6;border-color:#3b82f6}.toolbar-sep{width:1px;height:26px;background:#47617f;margin:0 3px}
    .layout{height:calc(100vh - 62px);display:grid;grid-template-columns:285px minmax(0,1fr);gap:14px;padding:14px;max-width:1900px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);min-width:0}.sidebar{display:flex;flex-direction:column;min-height:0}.panel-title{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);font-weight:700}.panel-title .muted{font-weight:400;color:var(--muted);font-size:12px}.module-tree{padding:8px;overflow:auto;flex:1}.module-item{border:1px solid transparent;border-radius:7px;margin-bottom:5px}.module-item.active{border-color:#9fc2f8;background:#f0f6ff}.module-head{display:flex;align-items:center;gap:7px;padding:8px 9px;cursor:pointer}.module-head .module-name{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis}.module-head .module-meta{color:var(--muted);font-size:11px}.module-actions{display:none;gap:3px}.module-head:hover .module-actions{display:flex}.module-actions button{padding:2px 6px;font-size:12px}.column-list{padding:0 8px 8px 28px}.column-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:3px 2px}.column-row input{accent-color:var(--primary)}.column-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-foot{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.workspace{display:flex;flex-direction:column;min-width:0;min-height:0;gap:12px}.filebar{display:flex;align-items:center;gap:14px;min-height:34px}.filebar strong{font-size:16px}.filebar .path{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filebar .status{margin-left:auto;color:var(--muted);font-size:12px}.dirty-dot{display:inline-block;width:8px;height:8px;background:#f59e0b;border-radius:50%;margin-right:5px}
    .filters{padding:12px 14px}.filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.filters-head strong{font-size:15px}.filters-head span{font-size:12px;color:var(--muted)}.filter-grid{display:grid;grid-template-columns:1fr 88px 1.2fr 74px 1fr;gap:7px;align-items:center}.filter-grid label{font-size:12px;color:var(--muted)}.filter-grid .relation{font-size:12px;color:var(--muted);text-align:center}.filter-grid input[type=checkbox]{accent-color:var(--primary)}.filter-grid select,.filter-grid input[type=text]{width:100%}.filter-grid .filter-valid{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}.filter-grid .filter-valid input{accent-color:var(--primary)}
    .content-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;min-height:0;flex:1}.properties,.data-panel{display:flex;flex-direction:column;min-height:0}.subhead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}.subhead strong{flex:1}.subhead span{font-size:12px;color:var(--muted)}.prop-wrap{overflow:auto;flex:1}.prop-table,.data-table{border-collapse:collapse;width:100%;font-size:13px}.prop-table th,.prop-table td{border-bottom:1px solid #edf1f6;padding:6px 8px;text-align:left;vertical-align:middle}.prop-table th{position:sticky;top:0;background:#f8fafc;color:var(--muted);font-size:12px;z-index:1}.prop-table td:first-child{color:var(--muted);width:42%}.prop-table td input{width:100%;padding:5px 6px;border-color:transparent;background:transparent}.prop-table td input:focus{background:#fff;border-color:#9fc2f8}.panel-actions{padding:9px 11px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}.panel-actions button{font-size:12px;padding:6px 9px}.data-tools{display:flex;gap:5px;flex-wrap:wrap}.data-tools button{font-size:12px;padding:5px 8px}.table-wrap{overflow:auto;flex:1;min-height:200px}.data-table th,.data-table td{border-right:1px solid #e7edf5;border-bottom:1px solid #e7edf5;padding:6px 8px;min-width:92px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.data-table th{position:sticky;top:0;background:#f8fafc;color:#334155;z-index:2;font-weight:700;cursor:pointer}.data-table th:first-child{left:0;z-index:3;min-width:52px;width:52px;text-align:center}.data-table td:first-child{position:sticky;left:0;background:#fbfdff;z-index:1;text-align:center;color:var(--muted);min-width:52px;width:52px;cursor:pointer}.data-table td[contenteditable=true]{cursor:text}.data-table td[contenteditable=true]:focus{outline:2px solid #93c5fd;outline-offset:-2px;background:#fff}.data-table td.selected,.data-table th.selected{background:#dbeafe!important;color:#1d4ed8}.data-table tr.filtered-out{display:none}.selection-info{min-height:31px;padding:7px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}.selection-info strong{color:var(--text)}.chart-wrap{height:125px;border-top:1px solid var(--line);padding:5px 12px;display:none}.chart-wrap.visible{display:block}.chart-wrap canvas{width:100%;height:112px}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;bottom:22px;background:#10233d;color:#fff;border-radius:7px;padding:10px 15px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.kbd{font-size:11px;border:1px solid #cbd5e1;border-radius:4px;padding:1px 5px;color:var(--muted);background:#f8fafc}
    @media(max-width:1250px){body{min-width:980px}.layout{grid-template-columns:245px minmax(0,1fr)}.content-grid{grid-template-columns:235px minmax(0,1fr)}.filter-grid{grid-template-columns:1fr 78px 1fr 70px 1fr}}
    @media print{body{min-width:0;background:#fff}.topbar,.sidebar,.filters,.filebar .status,.panel-actions,.data-tools,.selection-info,.chart-wrap{display:none!important}.layout{display:block;height:auto;padding:0}.workspace{display:block}.filebar{display:block;margin-bottom:10px}.filebar .path{display:block}.content-grid{display:block}.properties{display:none}.panel{border:0;box-shadow:none}.data-panel{display:block}.table-wrap{overflow:visible}.data-table th{position:static}.data-table td:first-child{position:static}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">E 文件管理工具 <small>本地单文件</small></div>
    <div class="toolbar">
      <button id="newFile">新建</button><button id="openFile">打开</button><button id="saveFile" class="primary">保存</button><button id="saveAsFile">另存为</button><span class="toolbar-sep"></span><button id="refreshFile">刷新</button><button id="exportCsv">输出 CSV</button><button id="printFile">打印</button><span class="toolbar-sep"></span><button id="copyCells">复制</button><button id="pasteCells">粘贴</button><button id="toggleChart">曲线</button>
    </div>
    <input id="fileInput" type="file" accept=".e,.E,.txt,*/*" hidden>
  </header>
  <main class="layout">
    <aside class="sidebar panel">
      <div class="panel-title"><span>模块</span><span><span id="moduleCount" class="muted">0 个</span> <button id="addModule" class="icon" title="新增模块">＋</button></span></div>
      <div id="moduleTree" class="module-tree"></div>
      <div class="side-foot">单击模块加载数据；勾选列控制显示。右侧数据表支持直接编辑。</div>
    </aside>
    <section class="workspace">
      <div class="filebar"><strong id="fileName">未命名.e</strong><span id="filePath" class="path">尚未打开文件</span><span id="status" class="status">未保存</span></div>
      <section class="panel filters">
        <div class="filters-head"><strong>查询与过滤</strong><span>支持三组条件；关系可选 AND / OR</span><button id="applyFilter" class="primary">查询</button></div>
        <div id="filterGrid" class="filter-grid"></div>
      </section>
      <section class="content-grid">
        <section class="panel properties">
          <div class="subhead"><strong>模块属性</strong><span id="propCount">0 项</span></div>
          <div class="prop-wrap"><table class="prop-table"><thead><tr><th>属性</th><th>值</th></tr></thead><tbody id="propBody"></tbody></table><div id="propEmpty" class="empty">请选择模块</div></div>
          <div class="panel-actions"><button id="addProp">添加属性</button><button id="deleteProp" class="danger">删除属性</button><button id="clearProps">清空属性</button></div>
        </section>
        <section class="panel data-panel">
          <div class="subhead"><strong id="dataTitle">数据表</strong><span id="rowCount">0 行</span><div class="data-tools"><button id="addRow">新增行</button><button id="addCol">新增列</button><button id="renameCol">重命名列</button><button id="deleteRows" class="danger">删行</button><button id="deleteCols" class="danger">删列</button><button id="clearRows" class="danger">清空行</button><button id="moveUp">上移</button><button id="moveDown">下移</button><button id="moveLeft">左移列</button><button id="moveRight">右移列</button></div></div>
          <div id="tableWrap" class="table-wrap"><div class="empty">请选择模块</div></div>
          <div id="selectionInfo" class="selection-info"><span>点击单元格选择；Ctrl+C / Ctrl+V 可复制粘贴</span><span></span></div>
          <div id="chartWrap" class="chart-wrap"><canvas id="chart"></canvas></div>
        </section>
      </section>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
  (()=>{
    'use strict';
    const $=id=>document.getElementById(id);
    const uid=()=>Math.random().toString(36).slice(2);
    const defaultModel=()=>({header:{},modules:[{name:'main',utility:'',props:{说明:'新建 E 文件'},columns:[{name:'code',desc:'编码'},{name:'name',desc:'名称'},{name:'value',desc:'数值'}],rows:[['001','示例测点','0'],['002','第二测点','0']]}]});
    const state={model:defaultModel(),active:0,fileName:'未命名.e',filePath:'尚未打开文件',fileHandle:null,dirty:false,visible:{},selected:new Set(),filters:[{valid:false,col:0,op:'contains',value:''},{valid:false,col:0,op:'contains',value:''},{valid:false,col:0,op:'contains',value:''}],relations:['AND','AND'],filterActive:false,filteredRows:[],toastTimer:0};
    const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const toast=msg=>{const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.remove('show'),2300)};
    const markDirty=()=>{state.dirty=true;renderStatus();};
    const renderStatus=()=>{$('status').innerHTML=state.dirty?'<span class="dirty-dot"></span>有未保存修改':'已保存'};
    const current=()=>state.model.modules[state.active]||null;
    function resetVisibility(){const m=current();if(!m)return;m.columns.forEach(c=>{const k=m.name+'::'+c.name;if(state.visible[k]===undefined)state.visible[k]=true})}
    function visibleIndexes(m){return m.columns.map((c,i)=>state.visible[m.name+'::'+c.name]!==false?i:-1).filter(i=>i>=0)}
    function normalizeModel(m){if(!m||!Array.isArray(m.modules))return defaultModel();m.header=m.header||{};m.modules=m.modules.map((x,i)=>({name:String(x.name||('module'+(i+1))),utility:String(x.utility||''),props:x.props||{},columns:Array.isArray(x.columns)&&x.columns.length?x.columns.map(c=>({name:String(c.name||'col'),desc:String(c.desc||'')})):[{name:'value',desc:'值'}],rows:Array.isArray(x.rows)?x.rows.map(r=>Array.isArray(r)?r.map(v=>String(v??'')):[]):[]}));m.modules.forEach(x=>x.rows.forEach(r=>{while(r.length<x.columns.length)r.push('');if(r.length>x.columns.length)r.length=x.columns.length}));return m}
    function parseTokens(text){const out=[];let cur='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==="'"){if(quoted&&text[i+1]==="'"){cur+="'";i++;continue}quoted=!quoted;continue}if(!quoted&&/\s/.test(ch)){if(cur!==''||out.length)out.push(cur);cur='';while(i+1<text.length&&/\s/.test(text[i+1]))i++;}else cur+=ch}if(cur!==''||out.length)out.push(cur);return out}
    function parseHeader(line){const h={};const body=line.replace(/^<!\s*/,'').replace(/\s*!>\s*$/,'');const re=/([\w.-]+)\s*=\s*(?:'((?:''|[^'])*)'|([^\s]+))/g;let m;while((m=re.exec(body))){h[m[1]]=(m[2]!==undefined?m[2].replace(/''/g,"'"):m[3])}return h}
    function parseEFile(text){const lines=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n');const model={header:{},modules:[]};let mod=null,seenCols=false;for(const raw of lines){const line=raw.trim();if(!line||line.startsWith('//')&&!mod)continue;if(line.startsWith('<!')){Object.assign(model.header,parseHeader(line));continue}if(line.startsWith('</')){mod=null;continue}if(line.startsWith('<')&&line.endsWith('>')){const body=line.slice(1,-1).trim();const toks=parseTokens(body);const title=toks.shift()||'module';const [name,utility='']=title.split('::');mod={name,utility,props:{},columns:[],rows:[]};for(let i=0;i<toks.length;i++){const k=toks[i];if(toks[i+1]==='='){mod.props[k]=toks[i+2]||'';i+=2}else{const eq=k.indexOf('=');if(eq>0)mod.props[k.slice(0,eq)]=k.slice(eq+1)}}model.modules.push(mod);seenCols=false;continue}if(!mod)continue;if(line.startsWith('@')){mod.columns=parseTokens(line.slice(1)).map(name=>({name,desc:''}));seenCols=true;continue}if(line.startsWith('//')&&seenCols){const d=parseTokens(line.slice(2));mod.columns.forEach((c,i)=>c.desc=d[i]||'');continue}if(line.startsWith('#')){const row=parseTokens(line.slice(1));while(row.length<mod.columns.length)row.push('');mod.rows.push(row.slice(0,mod.columns.length));}}return normalizeModel(model)}
    const needsQuote=v=>v===''||/[\s#@<>='"!]/.test(v);
    const token=v=>{v=String(v??'');return needsQuote(v)?"'"+v.replace(/'/g,"''")+"'":v};
    function serializeEFile(model){const out=[];const hs=Object.entries(model.header||{});if(hs.length)out.push('<! '+hs.map(([k,v])=>k+'='+token(v)).join(' ')+' !>');for(const m of model.modules){const title=m.name+(m.utility?'::'+m.utility:'');const props=Object.entries(m.props||{}).map(([k,v])=>k+' = '+token(v)).join(' ');out.push('<'+title+(props?' '+props:'')+'>');out.push('@'+m.columns.map(c=>c.name).join(' '));out.push('//'+m.columns.map(c=>token(c.desc||'null')).join(' '));for(const r of m.rows)out.push('#'+m.columns.map((_,i)=>token(r[i]??'')).join(' '));out.push('</'+m.name+'>')}return out.join('\n')+'\n'}
    function renderAll(){resetVisibility();$('fileName').textContent=state.fileName;$('filePath').textContent=state.filePath;$('moduleCount').textContent=state.model.modules.length+' 个';renderStatus();renderModuleTree();renderFilters();renderProperties();renderData()}
    function renderModuleTree(){const box=$('moduleTree');box.innerHTML='';state.model.modules.forEach((m,mi)=>{const item=document.createElement('div');item.className='module-item'+(mi===state.active?' active':'');const head=document.createElement('div');head.className='module-head';head.innerHTML='<span>▾</span><span class="module-name" title="'+escapeHtml(m.name)+'">'+escapeHtml(m.name)+'</span><span class="module-meta">'+m.rows.length+'×'+m.columns.length+'</span><span class="module-actions"><button data-act="rename" title="重命名">改</button><button data-act="delete" class="danger" title="删除模块">删</button></span>';head.addEventListener('click',e=>{const act=e.target.dataset.act;if(act==='rename'){renameModule(mi);return}if(act==='delete'){deleteModule(mi);return}state.active=mi;state.selected.clear();state.filters.forEach(f=>{f.valid=false});renderAll()});item.appendChild(head);const cols=document.createElement('div');cols.className='column-list';m.columns.forEach((c,ci)=>{const row=document.createElement('label');row.className='column-row';const ck=document.createElement('input');ck.type='checkbox';ck.checked=state.visible[m.name+'::'+c.name]!==false;ck.addEventListener('click',e=>{e.stopPropagation();state.visible[m.name+'::'+c.name]=ck.checked;renderData()});row.appendChild(ck);const sp=document.createElement('span');sp.textContent=c.name+' · '+(c.desc||'');row.appendChild(sp);cols.appendChild(row)});item.appendChild(cols);box.appendChild(item)})}
    function renderFilters(){const m=current(),box=$('filterGrid');if(!m){box.innerHTML='<span class="empty">请选择模块</span>';return}const options=m.columns.map((c,i)=>'<option value="'+i+'">'+escapeHtml(c.name)+' · '+escapeHtml(c.desc||'')+'</option>').join('');box.innerHTML='';state.filters.forEach((f,i)=>{const valid=document.createElement('label');valid.className='filter-valid';valid.innerHTML='<input type="checkbox" '+(f.valid?'checked':'')+'> 条件'+(i+1);valid.firstElementChild.addEventListener('change',e=>{f.valid=e.target.checked;applyFilter()});box.appendChild(valid);const sel=document.createElement('select');sel.innerHTML=options;sel.value=String(Math.min(f.col,m.columns.length-1));sel.addEventListener('change',e=>{f.col=Number(e.target.value);applyFilter()});box.appendChild(sel);const op=document.createElement('select');[['contains','包含'],['=','等于'],['!=','不等于'],['>','大于'],['>=','大于等于'],['<','小于'],['<=','小于等于']].forEach(([v,t])=>op.add(new Option(t,v)));op.value=f.op;op.addEventListener('change',e=>{f.op=e.target.value;applyFilter()});box.appendChild(op);const inp=document.createElement('input');inp.type='text';inp.placeholder='输入条件值';inp.value=f.value;inp.addEventListener('input',e=>{f.value=e.target.value});inp.addEventListener('keydown',e=>{if(e.key==='Enter')applyFilter()});box.appendChild(inp);if(i<2){const rel=document.createElement('select');rel.className='relation';rel.innerHTML='<option>AND</option><option>OR</option>';rel.value=state.relations[i];rel.addEventListener('change',e=>{state.relations[i]=e.target.value;applyFilter()});box.appendChild(rel)}else{const spacer=document.createElement('span');spacer.className='relation';spacer.textContent='';box.appendChild(spacer)}});applyFilter(false)}
    function renderProperties(){const m=current(),body=$('propBody');body.innerHTML='';$('propEmpty').style.display=m?'none':'block';$('propCount').textContent=m?Object.keys(m.props).length+' 项':'0 项';if(!m)return;Object.entries(m.props).forEach(([k,v])=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+escapeHtml(k)+'</td><td><input data-prop="'+escapeHtml(k)+'" value="'+escapeHtml(v)+'"></td>';tr.querySelector('input').addEventListener('change',e=>{m.props[k]=e.target.value;markDirty()});body.appendChild(tr)})}
    function renderData(){const m=current(),wrap=$('tableWrap');if(!m){wrap.innerHTML='<div class="empty">请选择模块</div>';return}const vis=visibleIndexes(m);const filtered=state.filterActive?state.filteredRows:Array.from({length:m.rows.length},(_,i)=>i);const table=document.createElement('table');table.className='data-table';const thead=document.createElement('thead'),hr=document.createElement('tr');const th=document.createElement('th');th.textContent='#';th.addEventListener('click',()=>selectAllVisibleRows());hr.appendChild(th);vis.forEach(ci=>{const h=document.createElement('th');h.textContent=m.columns[ci].name+(m.columns[ci].desc?' · '+m.columns[ci].desc:'');h.title='点击选择整列';h.addEventListener('click',()=>selectColumn(ci));h.className=selectedColumn(ci)?'selected':'';hr.appendChild(h)});thead.appendChild(hr);table.appendChild(thead);const tb=document.createElement('tbody');filtered.forEach((ri,displayIndex)=>{const tr=document.createElement('tr');const rh=document.createElement('td');rh.textContent=String(ri+1);rh.title='点击选择整行';rh.addEventListener('click',()=>selectRow(ri));if(selectedRow(ri))rh.classList.add('selected');tr.appendChild(rh);vis.forEach(ci=>{const td=document.createElement('td');td.contentEditable='true';td.textContent=m.rows[ri][ci]??'';td.dataset.key=ri+':'+ci;td.className=state.selected.has(td.dataset.key)?'selected':'';td.addEventListener('click',e=>selectCell(ri,ci,e));td.addEventListener('blur',()=>{if(m.rows[ri][ci]!==td.textContent){m.rows[ri][ci]=td.textContent;markDirty()}});td.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();td.blur()}});tr.appendChild(td)});tb.appendChild(tr)});table.appendChild(tb);wrap.innerHTML='';wrap.appendChild(table);$('dataTitle').textContent=m.name+' · 数据';$('rowCount').textContent=m.rows.length+' 行（当前显示 '+filtered.length+' 行）';updateSelectionInfo();drawChart()}
    function selectedRow(ri){return [...state.selected].some(k=>Number(k.split(':')[0])===ri)}function selectedColumn(ci){return [...state.selected].some(k=>Number(k.split(':')[1])===ci)}
    function selectCell(r,c,e){const k=r+':'+c;if(!e.ctrlKey&&!e.metaKey)state.selected.clear();if(state.selected.has(k))state.selected.delete(k);else state.selected.add(k);renderData()}

    function selectAllVisibleRows(){state.selected.clear();const m=current();(state.filteredRows.length?state.filteredRows:Array.from({length:m.rows.length},(_,i)=>i)).forEach(r=>m.columns.forEach((_,c)=>state.selected.add(r+':'+c)));renderData()}
    function updateSelectionInfo(){const vals=[],m=current();state.selected.forEach(k=>{const [r,c]=k.split(':').map(Number);const v=Number(m?.rows[r]?.[c]);if(Number.isFinite(v))vals.push(v)});const left=vals.length?'<strong>选中 '+vals.length+' 个数值</strong>　总和 '+fmt(sum(vals))+'　平均 '+fmt(sum(vals)/vals.length)+'　最大 '+fmt(Math.max(...vals))+'　最小 '+fmt(Math.min(...vals)):'点击单元格选择；Ctrl+C / Ctrl+V 可复制粘贴';$('selectionInfo').firstElementChild.innerHTML=left;$('selectionInfo').lastElementChild.textContent=state.selected.size?'已选 '+state.selected.size+' 个单元格':''}
    const sum=a=>a.reduce((x,y)=>x+y,0),fmt=v=>Number(v).toFixed(5).replace(/\.?0+$/,'');
    function applyFilter(redraw=true){const m=current();if(!m){state.filterActive=false;state.filteredRows=[];return}const active=state.filters.filter(f=>f.valid&&m.columns[f.col]);state.filterActive=active.length>0;if(!active.length){state.filteredRows=[];if(redraw)renderData();return}const test=(r,f)=>{const v=String(r[f.col]??''),q=String(f.value??'');if(f.op==='contains')return v.toLowerCase().includes(q.toLowerCase());const a=Number(v),b=Number(q),numeric=q!==''&&Number.isFinite(a)&&Number.isFinite(b);const x=numeric?a:v,y=numeric?b:q;return f.op==='='?x===y:f.op==='!='?x!==y:f.op==='>'?x>y:f.op==='>='?x>=y:f.op==='<'?x<y:f.op==='<='?x<=y:true};state.filteredRows=m.rows.map((r,i)=>({i,ok:active.reduce((acc,f,j)=>j===0?test(r,f):(state.relations[j-1]==='AND'?acc&&test(r,f):acc||test(r,f)),true)})).filter(x=>x.ok).map(x=>x.i);if(redraw)renderData()}
    function addModule(){let name=prompt('模块名称','module'+(state.model.modules.length+1));if(name===null)return;name=name.trim();if(!name)return toast('模块名称不能为空');if(state.model.modules.some(m=>m.name===name))return toast('模块名称重复');state.model.modules.push({name,utility:'',props:{},columns:[{name:'value',desc:'值'}],rows:[['']]});state.active=state.model.modules.length-1;markDirty();renderAll();toast('已新增模块')}
    function renameModule(i){const m=state.model.modules[i],name=prompt('新的模块名称',m.name);if(name===null)return;const n=name.trim();if(!n||n===m.name)return;if(state.model.modules.some((x,j)=>j!==i&&x.name===n))return toast('模块名称重复');m.name=n;markDirty();renderAll()}
    function deleteModule(i){if(!confirm('确认删除模块“'+state.model.modules[i].name+'”？'))return;state.model.modules.splice(i,1);state.active=Math.max(0,Math.min(state.active,state.model.modules.length-1));state.selected.clear();markDirty();renderAll();toast('模块已删除')}
    function addRow(){const m=current();if(!m)return toast('请先选择模块');m.rows.push(m.columns.map(()=>''));markDirty();renderData()}
    function addCol(){const m=current();if(!m)return toast('请先选择模块');const name=prompt('列名称','col'+(m.columns.length+1));if(name===null)return;const n=name.trim();if(!n)return;if(m.columns.some(c=>c.name===n))return toast('列名称重复');const desc=prompt('列描述','');m.columns.push({name:n,desc:desc??''});m.rows.forEach(r=>r.push(''));state.visible[m.name+'::'+n]=true;markDirty();renderAll()}
    function renameCol(){const m=current();if(!m)return;const cols=[...new Set([...state.selected].map(k=>Number(k.split(':')[1])))];const ci=cols[0]??0;if(!m.columns[ci])return;const n=prompt('列名称',m.columns[ci].name);if(n===null)return;const name=n.trim();if(!name||name===m.columns[ci].name)return;if(m.columns.some((c,i)=>i!==ci&&c.name===name))return toast('列名称重复');const desc=prompt('列描述',m.columns[ci].desc)||'';const old=m.name+'::'+m.columns[ci].name;m.columns[ci]={name,desc};state.visible[m.name+'::'+name]=state.visible[old]!==false;delete state.visible[old];markDirty();renderAll()}
    function deleteRows(){const m=current();if(!m)return;const rows=[...new Set([...state.selected].map(k=>Number(k.split(':')[0])))].filter(Number.isInteger).sort((a,b)=>b-a);if(!rows.length)return toast('请先选择要删除的行');if(!confirm('确认删除 '+rows.length+' 行？'))return;rows.forEach(i=>m.rows.splice(i,1));state.selected.clear();markDirty();renderData()}
    function deleteCols(){const m=current();if(!m)return;const cols=[...new Set([...state.selected].map(k=>Number(k.split(':')[1])))].filter(Number.isInteger).sort((a,b)=>b-a);if(!cols.length)return toast('请先选择要删除的列');if(cols.length>=m.columns.length)return toast('至少保留一列');if(!confirm('确认删除 '+cols.length+' 列？'))return;cols.forEach(i=>{const old=m.name+'::'+m.columns[i].name;m.columns.splice(i,1);m.rows.forEach(r=>r.splice(i,1));delete state.visible[old]});state.selected.clear();markDirty();renderAll()}
    function clearRows(){const m=current();if(!m||!m.rows.length)return;if(!confirm('确认清空当前模块全部数据行？'))return;m.rows=[];state.selected.clear();markDirty();renderData()}
    function moveRows(dir){const m=current();if(!m)return;const rows=[...new Set([...state.selected].map(k=>Number(k.split(':')[0])))].sort((a,b)=>dir==='up'?a-b:b-a);if(!rows.length)return toast('请先选择行');for(const r of rows){const to=dir==='up'?r-1:r+1;if(to<0||to>=m.rows.length)continue;[m.rows[r],m.rows[to]]=[m.rows[to],m.rows[r]];state.selected=new Set([...state.selected].map(k=>{const [rr,cc]=k.split(':').map(Number);return (rr===r?to:rr===to?r:rr)+':'+cc}))}markDirty();renderData()}
    function moveCols(dir){const m=current();if(!m)return;const cols=[...new Set([...state.selected].map(k=>Number(k.split(':')[1])))].sort((a,b)=>dir==='left'?a-b:b-a);if(!cols.length)return toast('请先选择列');for(const c of cols){const to=dir==='left'?c-1:c+1;if(to<0||to>=m.columns.length)continue;[m.columns[c],m.columns[to]]=[m.columns[to],m.columns[c]];m.rows.forEach(r=>[r[c],r[to]]=[r[to],r[c]]);state.selected=new Set([...state.selected].map(k=>{const [rr,cc]=k.split(':').map(Number);return rr+':'+(cc===c?to:cc===to?c:cc)}))}markDirty();renderAll()}
    function addProp(){const m=current();if(!m)return;const k=prompt('属性名称','property');if(k===null)return;const key=k.trim();if(!key||Object.prototype.hasOwnProperty.call(m.props,key))return toast('属性为空或重复');m.props[key]=prompt('属性值','')||'';markDirty();renderProperties()}

    function drawChart(){const wrap=$('chartWrap'),canvas=$('chart'),m=current();if(!wrap.classList.contains('visible')||!m)return;const dpr=window.devicePixelRatio||1,w=canvas.clientWidth||800,h=canvas.clientHeight||110;canvas.width=w*dpr;canvas.height=h*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const rows=state.filteredRows.length?state.filteredRows:Array.from({length:m.rows.length},(_,i)=>i);const cis=visibleIndexes(m).filter(c=>rows.some(r=>Number.isFinite(Number(m.rows[r][c])))).slice(0,5);if(!cis.length){ctx.fillStyle='#64748b';ctx.fillText('当前没有可绘制的数值列',14,28);return}const colors=['#2563eb','#16a34a','#dc2626','#9333ea','#ea580c'];let min=Infinity,max=-Infinity;cis.forEach(c=>rows.forEach(r=>{const v=Number(m.rows[r][c]);if(Number.isFinite(v)){min=Math.min(min,v);max=Math.max(max,v)}}));if(min===max){min-=1;max+=1}ctx.strokeStyle='#dbe3ef';ctx.beginPath();ctx.moveTo(32,8);ctx.lineTo(32,h-22);ctx.lineTo(w-8,h-22);ctx.stroke();cis.forEach((c,idx)=>{ctx.strokeStyle=colors[idx];ctx.lineWidth=1.5;ctx.beginPath();rows.forEach((r,j)=>{const v=Number(m.rows[r][c]);if(!Number.isFinite(v))return;const x=34+(w-46)*(rows.length<=1?0:j/(rows.length-1));const y=h-23-(h-34)*(v-min)/(max-min);j?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=colors[idx];ctx.fillText(m.columns[c].name,42+idx*105,12)});ctx.fillStyle='#64748b';ctx.font='11px sans-serif';ctx.fillText(fmt(max),2,18);ctx.fillText(fmt(min),2,h-24)}
    function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    async function saveAs(){const text=serializeEFile(state.model);if(window.showSaveFilePicker){try{const h=await window.showSaveFilePicker({suggestedName:state.fileName||'untitled.e',types:[{description:'E 文件',accept:{'text/plain':['.e']}}]});const w=await h.createWritable();await w.write(text);await w.close();state.fileHandle=h;state.fileName=h.name||state.fileName;state.filePath='已保存到本地文件';state.dirty=false;renderAll();toast('文件已保存');return}catch(e){if(e.name==='AbortError')return}}download(state.fileName||'untitled.e',text,'text/plain;charset=utf-8');state.dirty=false;state.filePath='已下载文件（浏览器保存目录）';renderStatus();toast('文件已下载')}
    async function save(){if(state.fileHandle?.createWritable){try{const w=await state.fileHandle.createWritable();await w.write(serializeEFile(state.model));await w.close();state.dirty=false;renderStatus();toast('文件已保存');return}catch(e){toast('无法覆盖原文件，请使用另存为')}}await saveAs()}
    function newFile(){if(state.dirty&&!confirm('当前文件有未保存修改，确认新建并放弃修改？'))return;state.model=defaultModel();state.active=0;state.fileName='未命名.e';state.filePath='尚未保存';state.fileHandle=null;state.dirty=false;state.visible={};state.selected.clear();renderAll();toast('已新建空白 E 文件')}
    async function loadFile(file,handle=null){state.model=parseEFile(await file.text());state.active=0;state.fileName=file.name;state.filePath=file.webkitRelativePath||file.name;state.fileHandle=handle;state.dirty=false;state.visible={};state.selected.clear();state.filterActive=false;renderAll();toast('已打开 '+file.name)}
    async function openFile(){if(state.dirty&&!confirm('当前文件有未保存修改，确认打开其他文件？'))return;if(window.showOpenFilePicker){try{const [h]=await window.showOpenFilePicker({multiple:false,types:[{description:'E 文件',accept:{'text/plain':['.e','.E','.txt']}}]});await loadFile(await h.getFile(),h);return}catch(e){if(e.name==='AbortError')return}}$('fileInput').click()}
    $('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await loadFile(file)}catch(err){toast('打开失败：'+err.message)}e.target.value=''})
    $('newFile').onclick=newFile;$('openFile').onclick=openFile;$('saveFile').onclick=save;$('saveAsFile').onclick=saveAs;$('refreshFile').onclick=async()=>{if(state.dirty&&!confirm('当前文件有未保存修改，确认重新载入？'))return;if(state.fileHandle?.getFile){try{const f=await state.fileHandle.getFile();state.model=parseEFile(await f.text());state.dirty=false;state.selected.clear();state.filterActive=false;renderAll();toast('已重新载入')}catch(e){toast('重新载入失败')}}else{toast('浏览器安全限制下，请重新打开原文件')}};$('printFile').onclick=()=>window.print();$('addModule').onclick=addModule;$('addRow').onclick=addRow;$('addCol').onclick=addCol;$('renameCol').onclick=renameCol;$('deleteRows').onclick=deleteRows;$('deleteCols').onclick=deleteCols;$('clearRows').onclick=clearRows;$('moveUp').onclick=()=>moveRows('up');$('moveDown').onclick=()=>moveRows('down');$('moveLeft').onclick=()=>moveCols('left');$('moveRight').onclick=()=>moveCols('right');$('addProp').onclick=addProp;$('deleteProp').onclick=deleteProp;$('clearProps').onclick=clearProps;$('applyFilter').onclick=()=>applyFilter();$('toggleChart').onclick=()=>{$('chartWrap').classList.toggle('visible');drawChart()};
    $('exportCsv').onclick=()=>{const m=current();if(!m)return toast('请先选择模块');const cis=visibleIndexes(m),rows=state.filterActive?state.filteredRows:Array.from({length:m.rows.length},(_,i)=>i);const lines=[cis.map(c=>csv(m.columns[c].name+' '+(m.columns[c].desc||''))).join(',')];rows.forEach(r=>lines.push(cis.map(c=>csv(m.rows[r][c]??'')).join(',')));download((m.name||'data')+'.csv',lines.join('\r\n'),'text/csv;charset=utf-8');toast('CSV 已下载')};
    function csv(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
    $('copyCells').onclick=copySelected;$('pasteCells').onclick=pasteFromClipboard;async function copySelected(){const m=current();if(!m||!state.selected.size)return toast('请先选择单元格');const keys=[...state.selected].map(k=>k.split(':').map(Number)),rs=[...new Set(keys.map(x=>x[0]))].sort((a,b)=>a-b),cs=[...new Set(keys.map(x=>x[1]))].sort((a,b)=>a-b);const text=rs.map(r=>cs.map(c=>m.rows[r]?.[c]??'').join('\t')).join('\n');try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制')}}async function pasteFromClipboard(){const m=current();if(!m||!state.selected.size)return toast('请先选择起始单元格');let text='';try{text=await navigator.clipboard.readText()}catch(e){text=prompt('请粘贴制表符分隔的数据','')||''}if(!text)return;const start=[...state.selected][0].split(':').map(Number),rows=text.replace(/\r/g,'').split('\n').map(r=>r.split('\t'));rows.forEach((row,ri)=>row.forEach((v,ci)=>{const r=start[0]+ri,c=start[1]+ci;if(r>=m.rows.length)m.rows.push(m.columns.map(()=>''));if(c>=m.columns.length)return;m.rows[r][c]=v}));markDirty();renderData();toast('已粘贴')}
